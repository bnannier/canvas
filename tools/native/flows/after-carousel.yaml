appId: com.nannier.canvas.starter.smoke
name: Sealed Canvas native candidate after measured drag
---
- assertVisible:
    id: carousel-current
    text: 'Current page: 3'
- assertVisible:
    id: carousel-changes
    text: 'Page changes: 1'
- assertVisible: Slide 3 of 6, current slide
- assertVisible:
    id: carousel-page-3
- takeScreenshot: carousel-swiped-page
- tapOn: Slide 6 of 6
- assertVisible:
    id: carousel-current
    text: 'Current page: 6'
- assertVisible:
    id: carousel-changes
    text: 'Page changes: 2'
- assertVisible: Slide 6 of 6, current slide
- assertVisible:
    id: carousel-page-6
- takeScreenshot: carousel-picker-jump
# The diagnostic retains the actual visible host band after keyboard dismissal.
# Keep the keyboard open until the previously obscured final match is selected.
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=keyboard
- scrollUntilVisible:
    element:
      id: overlay-visible-measurement
      text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
    direction: DOWN
- takeScreenshot: autocomplete-visible-band-before-keyboard
- scrollUntilVisible:
    element:
      id: fruit-input
    direction: UP
- tapOn:
    id: fruit-input
- inputText: Ap
- scrollUntilVisible:
    element:
      text: Pineapple
    direction: DOWN
- takeScreenshot: autocomplete-final-match-with-keyboard
- tapOn: Pineapple
- assertVisible:
    id: fruit-input
    text: Pineapple
- hideKeyboard
- scrollUntilVisible:
    element:
      id: selection-count
    direction: DOWN
- assertVisible:
    id: selection-count
    text: '1'
- assertVisible:
    id: submit-count
    text: '0'
- scrollUntilVisible:
    element:
      id: overlay-resize-observation
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: autocomplete-visible-band-after-selection
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=modal-keyboard
- tapOn: Open fruit drawer
- assertVisible:
    id: overlay-visible-measurement
    text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
- takeScreenshot: drawer-visible-band-before-keyboard
- tapOn:
    id: drawer-fruit-input
- inputText: Ap
- scrollUntilVisible:
    element:
      text: Pineapple
    direction: DOWN
- takeScreenshot: drawer-final-match-with-keyboard
- tapOn: Pineapple
- assertVisible:
    id: drawer-fruit-input
    text: Pineapple
# Submit the active iOS input through its real keyboard action. A generic
# dismiss gesture cannot reach a keyboard inside this native Modal reliably.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: Return
      - assertNotVisible:
          id: space
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: drawer-visible-band-after-selection
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=command-keyboard
- scrollUntilVisible:
    element:
      id: overlay-visible-measurement
      text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
    direction: DOWN
- scrollUntilVisible:
    element:
      id: keyboard-command
    direction: UP
- tapOn: Search...
# Opening the actual mounted card must focus its input without another tap.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
# iOS can report focused=false for an active native text host. Actual typing
# without another tap plus the visible software space key verifies input focus.
- inputText: Work
- assertVisible: Work
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
# Native hierarchy visibility does not account for clipping by the results pane.
# Require the last row above the actual footer before selecting it.
- scrollUntilVisible:
    element:
      text: Work item 40
      above: to navigate
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- assertVisible: to navigate
- assertVisible: to select
- assertVisible: to close
- takeScreenshot: command-final-result-with-keyboard
# Typing after a real results drag proves that input focus was preserved.
- inputText: ' item'
- assertVisible:
    id: command-query
    text: 'Query: Work item'
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- scrollUntilVisible:
    element:
      text: Work item 40
      above: to navigate
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- assertVisible: to navigate
- assertVisible: to select
- assertVisible: to close
- takeScreenshot: command-before-final-selection
- tapOn:
    text: Work item 40
    above: to navigate
# Observe search input closure after selection. A generic hideKeyboard can
# send Android Back when the keyboard is already gone and leave this route.
- assertNotVisible: Search work items
- scrollUntilVisible:
    element:
      id: command-selected-index
    direction: DOWN
- assertVisible:
    id: command-query
    text: 'Query: Work item'
- assertVisible:
    id: command-selected
    text: 'Selected: Work item 40'
- assertVisible:
    id: command-selected-index
    text: 'Selected index: 39'
- assertVisible:
    id: command-selections
    text: 'Selections: 1'
- scrollUntilVisible:
    element:
      id: overlay-resize-observation
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: command-selected-with-preserved-query
# Material mode changes must preserve the live editor and retire native capture.
- openLink: canvas-smoke:///testing/materials
- assertVisible:
    id: material-mode
    text: 'Mode: solid; scheme: light'
- runFlow:
    when:
      true: ${SCHEME == 'dark'}
    commands:
      - tapOn: Switch scheme
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- eraseText
- inputText: Retained material text
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- copyTextFrom:
    id: material-editor-identity
- evalScript: ${output.materialEditorIdentity = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: material-inspect
    direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: material-native
          text: 'Native capture: available'
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
- tapOn:
    id: material-toggle
- assertVisible:
    id: material-mode
    text: 'Mode: glass; scheme: ${SCHEME}'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [1-9][0-9]*; active: [1-9][0-9]*; recordings: [1-9][0-9]*; frost: [1-9][0-9]*; listeners: [1-9][0-9]*'
# Exercise a changing native capture, then let the scene become idle again.
- tapOn:
    id: material-animate
- extendedWaitUntil:
    visible:
      id: material-backdrop-motion
      text: Backdrop still
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [1-9][0-9]*; active: [1-9][0-9]*; recordings: [1-9][0-9]*; frost: [1-9][0-9]*; listeners: [1-9][0-9]*'
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor
    text: Retained material text
- assertVisible:
    id: material-editor-identity
    text: ${output.materialEditorIdentity}
- takeScreenshot: material-glass-editor-preserved
- scrollUntilVisible:
    element:
      id: material-toggle
    direction: UP
- tapOn:
    id: material-toggle
- assertVisible:
    id: material-mode
    text: 'Mode: solid; scheme: ${SCHEME}'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
      - copyTextFrom:
          id: material-capture-stats
      - evalScript: ${output.stoppedMaterialCapture = maestro.copiedText}
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: ${output.stoppedMaterialCapture}
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor-identity
    text: ${output.materialEditorIdentity}
- assertVisible:
    id: material-editor
    text: Retained material text
- takeScreenshot: material-solid-editor-preserved
# An explicitly glass descendant must resume capture within a solid parent.
- scrollUntilVisible:
    element:
      id: material-nested
    direction: DOWN
- tapOn:
    id: material-nested
- scrollUntilVisible:
    element:
      id: material-inspect
    direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [1-9][0-9]*; active: [1-9][0-9]*; recordings: [1-9][0-9]*; frost: [1-9][0-9]*; listeners: [1-9][0-9]*'
- scrollUntilVisible:
    element:
      id: material-nested
    direction: DOWN
- tapOn:
    id: material-nested
- scrollUntilVisible:
    element:
      id: material-inspect
    direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
# Tap near the editor end so backspace and later insertion use the end caret.
# Arm the switch, then start its clock from a real focus event. This proves the
# mode changes while the editor is focused without racing scroll/typing latency.
- evalScript: ${output.materialEditorInstance = output.materialEditorIdentity.split(';')[0]}
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- eraseText
- inputText: Focus remains
- assertVisible:
    id: material-editor
    text: Focus remains
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-schedule
    direction: UP
- tapOn:
    id: material-schedule
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- extendedWaitUntil:
    visible:
      id: material-timer
      text: Switch complete
    timeout: 10000
- assertVisible:
    id: material-focus-mode
    text: Focus began in solid
- assertVisible:
    id: material-mode
    text: 'Mode: glass; scheme: ${SCHEME}'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: material-editor
          focused: true
- inputText: ' after glass'
- assertVisible:
    id: material-editor
    text: Focus remains after glass
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor-identity
    text: '${output.materialEditorInstance}; edits: [1-9][0-9]*'
- takeScreenshot: material-focused-glass-transition
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- eraseText
- inputText: Focus remains
- assertVisible:
    id: material-editor
    text: Focus remains
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-schedule
    direction: UP
- tapOn:
    id: material-schedule
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- extendedWaitUntil:
    visible:
      id: material-timer
      text: Switch complete
    timeout: 10000
- assertVisible:
    id: material-focus-mode
    text: Focus began in glass
- assertVisible:
    id: material-mode
    text: 'Mode: solid; scheme: ${SCHEME}'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: material-editor
          focused: true
- inputText: ' after solid'
- assertVisible:
    id: material-editor
    text: Focus remains after solid
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor-identity
    text: '${output.materialEditorInstance}; edits: [1-9][0-9]*'
- takeScreenshot: material-focused-solid-transition

# Android Back must dismiss each presented layer without leaving the fixture.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: material-toggle
          direction: UP
      - tapOn:
          id: material-toggle
      - assertVisible:
          id: material-mode
          text: 'Mode: glass; scheme: ${SCHEME}'
      - scrollUntilVisible:
          element: Material dialog
          direction: DOWN
      - tapOn: Material dialog
      - assertVisible: Live dialog
      - assertVisible: Confirm
      - takeScreenshot: material-viewport-dialog
      - pressKey: Back
      - assertNotVisible: Live dialog
      - assertVisible: Material dialog
      - tapOn: Material drawer
      - assertVisible: Native window
      - tapOn: Drawer menu
      - assertVisible: Nested choice
      - pressKey: Back
      - assertNotVisible: Nested choice
      - assertVisible: Native window
      - pressKey: Back
      - assertNotVisible: Native window
      - assertVisible: Material drawer
      - scrollUntilVisible:
          element:
            id: material-toggle
          direction: UP
      - tapOn:
          id: material-toggle
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
      - takeScreenshot: material-overlays-released
# The Backdrop engine: a production-shaped sky parks, resumes and reports its trace.
- openLink: canvas-smoke:///testing/backdrop
- assertVisible:
    id: backdrop-mode
    text: Backdrop running
- tapOn:
    id: backdrop-toggle
- assertVisible:
    id: backdrop-mode
    text: Backdrop still
- takeScreenshot: backdrop-parked
- tapOn:
    id: backdrop-toggle
- assertVisible:
    id: backdrop-mode
    text: Backdrop running
- tapOn:
    id: backdrop-sample
- extendedWaitUntil:
    visible:
      id: backdrop-trace
      text: 'Frames: [0-9]+; p50 [0-9.]+ ms; p95 [0-9.]+ ms; max [0-9.]+ ms; style writes/s: n/a; css animations: n/a'
    timeout: 8000
- takeScreenshot: backdrop-running-sampled
