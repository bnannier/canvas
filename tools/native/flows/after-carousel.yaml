- takeScreenshot: carousel-swiped-page
- tapOn: Slide 6 of 6
- assertVisible:
    id: carousel-current
    text: 'Current page: 6'
- assertVisible:
    id: carousel-changes
    text: 'Page changes: 2'
- assertVisible: Slide 6 of 6, current slide
- assertVisible:
    id: carousel-page-6
- takeScreenshot: carousel-picker-jump
# The diagnostic retains the actual visible host band after keyboard dismissal.
# Keep the keyboard open until the previously obscured final match is selected.
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=keyboard
- scrollUntilVisible:
    element:
      id: overlay-visible-measurement
      text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
    direction: DOWN
- takeScreenshot: autocomplete-visible-band-before-keyboard
- scrollUntilVisible:
    element:
      id: fruit-input
    direction: UP
- tapOn:
    id: fruit-input
- inputText: Ap
- scrollUntilVisible:
    element:
      text: Pineapple
    direction: DOWN
- takeScreenshot: autocomplete-final-match-with-keyboard
- tapOn: Pineapple
- assertVisible:
    id: fruit-input
    text: Pineapple
- hideKeyboard
- scrollUntilVisible:
    element:
      id: selection-count
    direction: DOWN
- assertVisible:
    id: selection-count
    text: '1'
- assertVisible:
    id: submit-count
    text: '0'
- scrollUntilVisible:
    element:
      id: overlay-resize-observation
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: autocomplete-visible-band-after-selection
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=modal-keyboard
- tapOn: Open fruit drawer
- assertVisible:
    id: overlay-visible-measurement
    text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
- takeScreenshot: drawer-visible-band-before-keyboard
- tapOn:
    id: drawer-fruit-input
- inputText: Ap
- scrollUntilVisible:
    element:
      text: Pineapple
    direction: DOWN
- takeScreenshot: drawer-final-match-with-keyboard
- tapOn: Pineapple
- assertVisible:
    id: drawer-fruit-input
    text: Pineapple
# Submit the active iOS input through its real keyboard action. A generic
# dismiss gesture cannot reach a keyboard inside this native Modal reliably.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: Return
      - assertNotVisible:
          id: space
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: drawer-visible-band-after-selection
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=command-keyboard
- scrollUntilVisible:
    element:
      id: overlay-visible-measurement
      text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
    direction: DOWN
- scrollUntilVisible:
    element:
      id: keyboard-command
    direction: UP
- tapOn: Search...
# Opening the actual mounted card must focus its input without another tap.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
# iOS can report focused=false for an active native text host. Actual typing
# without another tap plus the visible software space key verifies input focus.
- inputText: Work
- assertVisible: Work
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
# Native hierarchy visibility does not account for clipping by the results pane.
# Require the last row above the actual footer before selecting it.
# The focused field's caret never lets the screen settle on CI's slow screen checks:
# each swipe waited about 8.5 s there against about 4 s locally, so the four swipes
# to the last row overran the 20 s limit. The owner bounded the settle wait on
# 2026-10-11; every check below still runs. In Maestro 2.10 the bound applies to the
# hierarchy comparison after a swipe; the iOS driver's 3 s static-screen wait before
# it is fixed, so about 6.5 s per swipe remains on CI and the four swipes need about
# 26 s: the owner also raised this scroll's limit to 40 s on 2026-10-11.
- scrollUntilVisible:
    element:
      text: Work item 40
      above: to navigate
    direction: DOWN
    waitToSettleTimeoutMs: 1000
    timeout: 40000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- assertVisible: to navigate
- assertVisible: to select
- assertVisible: to close
- takeScreenshot: command-final-result-with-keyboard
# Typing after a real results drag proves that input focus was preserved: the
# search field shows the whole query (rows are named "Work item NN", so only the
# field matches). The page's own query record is checked once the palette closes:
# an open palette is modal to VoiceOver (the owner's AO-2 decision), so iOS takes
# the page out of the hierarchy this flow reads.
- inputText: ' item'
- assertVisible: Work item
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
# The same bounded settle wait and 40 s limit as the first scroll to the last row
# (the owner's decisions, 2026-10-11): the focused field's caret never lets the screen
# settle on CI's slow screen checks, about 8.5 s per swipe there against about 4 s
# locally.
- scrollUntilVisible:
    element:
      text: Work item 40
      above: to navigate
    direction: DOWN
    waitToSettleTimeoutMs: 1000
    timeout: 40000
# Maestro's "above" compares top edges only, and its visibility ignores the results
# pane's clipping, so it can stop with the last row's top just above the footer and
# the rest of the row under it, where a tap lands on the footer. One more scroll
# settles the list at its end, which is what reveals the whole last row.
- scroll
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- assertVisible: to navigate
- assertVisible: to select
- assertVisible: to close
- takeScreenshot: command-before-final-selection
- tapOn:
    text: Work item 40
    above: to navigate
# Observe search input closure after selection. A generic hideKeyboard can
# send Android Back when the keyboard is already gone and leave this route.
- assertNotVisible: Search work items
- scrollUntilVisible:
    element:
      id: command-selected-index
    direction: DOWN
- assertVisible:
    id: command-query
    text: 'Query: Work item'
- assertVisible:
    id: command-selected
    text: 'Selected: Work item 40'
- assertVisible:
    id: command-selected-index
    text: 'Selected index: 39'
- assertVisible:
    id: command-selections
    text: 'Selections: 1'
- scrollUntilVisible:
    element:
      id: overlay-resize-observation
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: command-selected-with-preserved-query
# Material mode changes must preserve the live editor and retire native capture.
- openLink: canvas-smoke:///testing/materials
- assertVisible:
    id: material-mode
    text: 'Mode: solid; scheme: light'
- runFlow:
    when:
      true: ${SCHEME == 'dark'}
    commands:
      - tapOn: Switch scheme
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- eraseText
- inputText: Retained material text
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- copyTextFrom:
    id: material-editor-identity
- evalScript: ${output.materialEditorIdentity = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: material-inspect
    direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: material-native
          text: 'Native capture: available'
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
- tapOn:
    id: material-toggle
- assertVisible:
    id: material-mode
    text: 'Mode: glass; scheme: ${SCHEME}'
# On Android, in-page glass has no safe capture target, so the page's surfaces take
# their solid skin and capture stays idle (the owner's P3a decision). That includes the
# card under the misplaced GlassModalBlurTarget: canvas-blur refuses the plane it is
# handed and the bridge withdraws it, so no frost stays mounted (GMBT-2). An open
# overlay is the safe consumer: its frost captures the page, and the menu row reads the
# counters while the menu is still open.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
      - scrollUntilVisible:
          element: Material menu
          direction: DOWN
      - tapOn: Material menu
      - tapOn: Inspect capture from menu
      - scrollUntilVisible:
          element:
            id: material-capture-stats
          direction: UP
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [1-9][0-9]*; active: [1-9][0-9]*; recordings: [1-9][0-9]*; frost: [1-9][0-9]*; listeners: [1-9][0-9]*'
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor
    text: Retained material text
- assertVisible:
    id: material-editor-identity
    text: ${output.materialEditorIdentity}
- takeScreenshot: material-glass-editor-preserved
- scrollUntilVisible:
    element:
      id: material-toggle
    direction: UP
- tapOn:
    id: material-toggle
- assertVisible:
    id: material-mode
    text: 'Mode: solid; scheme: ${SCHEME}'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
      - copyTextFrom:
          id: material-capture-stats
      - evalScript: ${output.stoppedMaterialCapture = maestro.copiedText}
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: ${output.stoppedMaterialCapture}
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor-identity
    text: ${output.materialEditorIdentity}
- assertVisible:
    id: material-editor
    text: Retained material text
- takeScreenshot: material-solid-editor-preserved
# An explicitly glass descendant must resume capture within a solid parent. Its
# in-page card is solid on Android (P3a), so the overlay it opens is the consumer.
- scrollUntilVisible:
    element:
      id: material-nested
    direction: DOWN
- tapOn:
    id: material-nested
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: Nested menu
          direction: DOWN
      - tapOn: Nested menu
      - tapOn: Inspect nested capture
- scrollUntilVisible:
    element:
      id: material-inspect
    direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [1-9][0-9]*; active: [1-9][0-9]*; recordings: [1-9][0-9]*; frost: [1-9][0-9]*; listeners: [1-9][0-9]*'
- scrollUntilVisible:
    element:
      id: material-nested
    direction: DOWN
- tapOn:
    id: material-nested
- scrollUntilVisible:
    element:
      id: material-inspect
    direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
# Tap near the editor end so backspace and later insertion use the end caret.
# Arm the switch, then start its clock from a real focus event. This proves the
# mode changes while the editor is focused without racing scroll/typing latency.
- evalScript: ${output.materialEditorInstance = output.materialEditorIdentity.split(';')[0]}
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- eraseText
- inputText: Focus remains
# The software keyboard covers the lower screen. Android's visible hierarchy leaves
# out what it covers, so bring the editor above it before reading it.
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- assertVisible:
    id: material-editor
    text: Focus remains
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-schedule
    direction: UP
- tapOn:
    id: material-schedule
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
# With the keyboard up, the switch's records above the editor and the focused editor
# do not fit on one phone screen together: read the records, then bring the editor
# above the keyboard before reading its focus and typing into it.
- scrollUntilVisible:
    element:
      id: material-timer
    direction: UP
- extendedWaitUntil:
    visible:
      id: material-timer
      text: Switch complete
    timeout: 10000
- assertVisible:
    id: material-focus-mode
    text: Focus began in solid
- assertVisible:
    id: material-mode
    text: 'Mode: glass; scheme: ${SCHEME}'
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: material-editor
          focused: true
- inputText: ' after glass'
- assertVisible:
    id: material-editor
    text: Focus remains after glass
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor-identity
    text: '${output.materialEditorInstance}; edits: [1-9][0-9]*'
- takeScreenshot: material-focused-glass-transition
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
- eraseText
- inputText: Focus remains
# The software keyboard covers the lower screen. Android's visible hierarchy leaves
# out what it covers, so bring the editor above it before reading it.
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- assertVisible:
    id: material-editor
    text: Focus remains
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-schedule
    direction: UP
- tapOn:
    id: material-schedule
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- tapOn:
    id: material-editor
    point: "95%,50%"
# With the keyboard up, the switch's records above the editor and the focused editor
# do not fit on one phone screen together: read the records, then bring the editor
# above the keyboard before reading its focus and typing into it.
- scrollUntilVisible:
    element:
      id: material-timer
    direction: UP
- extendedWaitUntil:
    visible:
      id: material-timer
      text: Switch complete
    timeout: 10000
- assertVisible:
    id: material-focus-mode
    text: Focus began in glass
- assertVisible:
    id: material-mode
    text: 'Mode: solid; scheme: ${SCHEME}'
- scrollUntilVisible:
    element:
      id: material-editor
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: material-editor
          focused: true
- inputText: ' after solid'
- assertVisible:
    id: material-editor
    text: Focus remains after solid
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: material-editor-identity
    direction: DOWN
- assertVisible:
    id: material-editor-identity
    text: '${output.materialEditorInstance}; edits: [1-9][0-9]*'
- takeScreenshot: material-focused-solid-transition

# Android Back must dismiss each presented layer without leaving the fixture.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: material-toggle
          direction: UP
      - tapOn:
          id: material-toggle
      - assertVisible:
          id: material-mode
          text: 'Mode: glass; scheme: ${SCHEME}'
      - scrollUntilVisible:
          element: Material dialog
          direction: DOWN
      - tapOn: Material dialog
      - assertVisible: Live dialog
      - assertVisible: Confirm
      - takeScreenshot: material-viewport-dialog
      - pressKey: Back
      - assertNotVisible: Live dialog
      - assertVisible: Material dialog
      - tapOn: Material drawer
      - assertVisible: Native window
      # The drawer is a Modal, a window of its own: through GlassModalBlurTarget its
      # glass frosts the page, so capture is live while it is open.
      - tapOn:
          id: material-drawer-inspect
      - assertVisible:
          id: material-drawer-capture-stats
          text: 'Hosts: [1-9][0-9]*; active: [1-9][0-9]*; recordings: [1-9][0-9]*; frost: [1-9][0-9]*; listeners: [1-9][0-9]*'
      - takeScreenshot: material-drawer-frost
      - tapOn: Drawer menu
      - assertVisible: Nested choice
      - pressKey: Back
      - assertNotVisible: Nested choice
      - assertVisible: Native window
      - pressKey: Back
      - assertNotVisible: Native window
      - assertVisible: Material drawer
      # Closed, the drawer lets its frost and the plane's recording go, still in glass.
      - scrollUntilVisible:
          element:
            id: material-inspect
          direction: UP
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
      # The sheet is a Modal too: its row reads the counters while the sheet is still
      # open, and once it has closed they are idle again.
      - scrollUntilVisible:
          element: Material sheet
          direction: DOWN
      - tapOn: Material sheet
      - assertVisible: Live sheet
      - takeScreenshot: material-sheet-frost
      - tapOn: Inspect capture from sheet
      - assertNotVisible: Live sheet
      - scrollUntilVisible:
          element:
            id: material-capture-stats
          direction: UP
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [1-9][0-9]*; active: [1-9][0-9]*; recordings: [1-9][0-9]*; frost: [1-9][0-9]*; listeners: [1-9][0-9]*'
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
      - scrollUntilVisible:
          element: Material sheet
          direction: DOWN
      - tapOn: Material sheet
      - assertVisible: Live sheet
      - pressKey: Back
      - assertNotVisible: Live sheet
      - assertVisible: Material sheet
      - scrollUntilVisible:
          element:
            id: material-toggle
          direction: UP
      - tapOn:
          id: material-toggle
      - tapOn:
          id: material-inspect
      - assertVisible:
          id: material-capture-stats
          text: 'Hosts: [0-9]+; active: 0; recordings: [0-9]+; frost: 0; listeners: 0'
      - takeScreenshot: material-overlays-released

# Hover feedback is web only (React Native delivers no pointer hover on iOS or Android
# by default), so on a device the hover fixture shows its controls at rest; its
# pressable card and primary button still press.
- openLink: canvas-smoke:///testing/hover
- assertVisible:
    id: hover-mode
    text: 'Mode: solid; scheme: light; palette: blush'
- tapOn:
    id: hover-primary
- assertVisible:
    id: hover-presses
    text: 'Presses: 1'
- tapOn:
    id: hover-card
- assertVisible:
    id: hover-presses
    text: 'Presses: 2'
- takeScreenshot: hover-at-rest

# The identity discs: Dark Factory's hue gradient on every platform, drawn with
# react-native-svg. The pressable disc and the neutral glyph-less tile still press.
- openLink: canvas-smoke:///testing/avatar
- assertVisible:
    id: avatar-mode
    text: 'Mode: solid; scheme: light; palette: blush'
- assertVisible:
    id: avatar-stage-20
# The pressable discs sit below the identity stages, under a phone's fold.
- scrollUntilVisible:
    element:
      id: avatar-pressable
    direction: DOWN
- tapOn:
    id: avatar-pressable
- scrollUntilVisible:
    element:
      id: avatar-presses
    direction: UP
- assertVisible:
    id: avatar-presses
    text: 'Presses: 1'
- scrollUntilVisible:
    element:
      id: avatar-neutral
    direction: DOWN
- tapOn:
    id: avatar-neutral
- scrollUntilVisible:
    element:
      id: avatar-presses
    direction: UP
- assertVisible:
    id: avatar-presses
    text: 'Presses: 2'
- takeScreenshot: avatar-identity-discs

# The touch-target harness: the controls under the platform minimum, each with a press
# counter. The flow proves the fixture mounts and its controls press; the taps just
# outside each control's box (the reach of its hitSlop) take device coordinates and are
# run by hand against uiautomator and accessibility frames (see the fixture's header).
- openLink: canvas-smoke:///testing/touch-target
- assertVisible:
    id: tt-mode
    text: 'Mode: solid; scheme: (light|dark)'
- tapOn:
    id: tt-button-small
- assertVisible:
    id: tt-count-button-small
    text: 'button-small 1, button-base 0'
- takeScreenshot: touch-target-at-rest
