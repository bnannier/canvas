appId: com.nannier.canvas.starter.smoke
name: Sealed Canvas native candidate
---
- launchApp:
    clearState: true
# The router must mount before Android can deliver a warm-start link.
- assertVisible: Your workspace
- openLink: canvas-smoke:///testing/diagnostics
# iOS can require first-use confirmation before opening the app's custom scheme.
- runFlow:
    when:
      platform: iOS
      visible: 'Open in “Canvas Starter Smoke”\?'
    commands:
      - tapOn: Open
- assertVisible: Candidate runtime identity
- assertVisible:
    id: smoke-input-mode
    text: package
- assertVisible:
    id: smoke-appearance
    text: ${SCHEME}
- assertVisible:
    id: smoke-candidate-revision
    text: ${CANDIDATE}
- assertVisible:
    id: smoke-package-sha256
    text: ${PACKAGE_SHA256}
- scrollUntilVisible:
    element:
      id: smoke-package-version
    direction: DOWN
- assertVisible:
    id: smoke-package-version
    text: ${PACKAGE_VERSION}
- takeScreenshot: identity
- scrollUntilVisible:
    element:
      id: smoke-bundle-url
    direction: DOWN
- assertVisible:
    id: smoke-bundle-url
    text: (file:|assets:|/).*
- openLink: canvas-smoke:///testing/control-refs
- assertVisible: Control refs
- tapOn: Inspect refs
- assertVisible:
    id: ref-attached
    text: 'Attached: 6'
- tapOn: Measure Slider
- assertVisible:
    id: ref-measurement
    text: 'Measured: [1-9][0-9]* × [1-9][0-9]*'
- tapOn: Focus Button
- scrollUntilVisible:
    element:
      text: Focus Checkbox
    direction: UP
- tapOn: Focus Checkbox
- scrollUntilVisible:
    element:
      text: Focus Switch
    direction: UP
- tapOn: Focus Switch
- scrollUntilVisible:
    element:
      text: Focus Radio
    direction: UP
- tapOn: Focus Radio
- scrollUntilVisible:
    element:
      text: Focus Select
    direction: UP
- tapOn: Focus Select
- scrollUntilVisible:
    element:
      text: Focus Slider
    direction: UP
- tapOn: Focus Slider
- scrollUntilVisible:
    element:
      id: ref-requested
    direction: UP
- assertVisible:
    id: ref-requested
    text: 'Requested: Slider'
- assertVisible:
    id: ref-changes
    text: 'Changes: 0'
- assertNotVisible: Ref dialog
- assertNotVisible: Pear
- takeScreenshot: refs-measured-without-activation
- scrollUntilVisible:
    element:
      text: Unmount controls
    direction: UP
- tapOn: Unmount controls
- tapOn: Inspect refs
- assertVisible:
    id: ref-attached
    text: 'Attached: 0'
- tapOn: Mount controls
- tapOn: Inspect refs
- assertVisible:
    id: ref-attached
    text: 'Attached: 6'
- scrollUntilVisible:
    element:
      id: ref-checkbox
    direction: DOWN
- tapOn:
    id: ref-checkbox
- scrollUntilVisible:
    element:
      id: ref-switch
    direction: DOWN
- tapOn:
    id: ref-switch
- scrollUntilVisible:
    element:
      id: ref-changes
    direction: UP
- assertVisible:
    id: ref-changes
    text: 'Changes: 2'
- takeScreenshot: refs-remounted-and-interactive
- openLink: canvas-smoke:///testing/form-autocomplete
- assertVisible: Form and autocomplete
- tapOn:
    id: fruit-input
- inputText: Ap
- assertVisible: Apricot
- takeScreenshot: autocomplete-open
- tapOn: Apricot
- hideKeyboard
- scrollUntilVisible:
    element:
      id: selection-count
    direction: DOWN
- assertVisible:
    id: fruit-value
    text: Apricot
- assertVisible:
    id: selection-count
    text: '1'
- assertVisible:
    id: submit-count
    text: '0'
- tapOn: Save choice
- assertVisible:
    id: submit-count
    text: '1'
- openLink: canvas-smoke:///testing/listbox
- assertVisible: Listbox input checks
- scrollUntilVisible:
    element:
      id: project-teams
    direction: DOWN
# Native layout flattening can expose a group and its rows as siblings.
# Scope the named row between the fixture's surrounding controls.
- tapOn:
    text: Frontend, Web applications
    below: Before teams
    above: After teams
- scrollUntilVisible:
    element:
      id: multi-pick-count
    direction: DOWN
- assertVisible:
    id: multi-change-count
    text: 'Changes: 1'
- assertVisible:
    id: multi-pick-count
    text: 'Picks: 1'
- takeScreenshot: listbox-selected
- scrollUntilVisible:
    element:
      id: project-teams
    direction: UP
- tapOn:
    text: Frontend, Web applications
    below: Before teams
    above: After teams
- scrollUntilVisible:
    element:
      id: multi-change-count
    direction: DOWN
- assertVisible:
    id: multi-change-count
    text: 'Changes: 2'
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=modal
- tapOn: Open fruit drawer
- takeScreenshot: drawer-field-before-keyboard
- tapOn:
    id: drawer-fruit-input
- inputText: Ap
- assertVisible: Apricot
- takeScreenshot: drawer-hosted-options
- tapOn: Apricot
- assertVisible:
    id: drawer-fruit-input
    text: Apricot
- assertNotVisible: Apple
- takeScreenshot: drawer-selection
- hideKeyboard
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=action-sheet-safe-area
- tapOn: Open safe area sheet
- assertVisible: Safe area actions
- assertVisible: Choose safe area action
- takeScreenshot: action-sheet-bottom-clearance
- tapOn: Choose safe area action
- assertVisible:
    id: sheet-selections
    text: 'Selections: 1'
- assertVisible:
    id: sheet-closes
    text: 'Closes: 1'
- tapOn: Open safe area sheet
- assertVisible: Choose safe area action
- takeScreenshot: action-sheet-cancel-clearance
# The full-window scrim shares the Cancel name. Select the actual bottom row.
- tapOn:
    text: Cancel safe area sheet
    below: Choose safe area action
- assertVisible:
    id: sheet-selections
    text: 'Selections: 1'
- assertVisible:
    id: sheet-closes
    text: 'Closes: 2'
- openLink: canvas-smoke:///testing/carousel
- assertVisible: Native carousel paging
- assertVisible:
    id: carousel-current
    text: 'Current page: 2'
- assertVisible:
    id: carousel-changes
    text: 'Page changes: 0'
- assertVisible: Slide 2 of 6, current slide
- assertVisible:
    id: carousel-page-2
- takeScreenshot: carousel-default-page
- swipe:
    from:
      id: carousel-slide-2
    direction: LEFT
- assertVisible:
    id: carousel-current
    text: 'Current page: 3'
- assertVisible:
    id: carousel-changes
    text: 'Page changes: 1'
- assertVisible: Slide 3 of 6, current slide
- assertVisible:
    id: carousel-page-3
- takeScreenshot: carousel-swiped-page
- tapOn: Slide 6 of 6
- assertVisible:
    id: carousel-current
    text: 'Current page: 6'
- assertVisible:
    id: carousel-changes
    text: 'Page changes: 2'
- assertVisible: Slide 6 of 6, current slide
- assertVisible:
    id: carousel-page-6
- takeScreenshot: carousel-picker-jump
# The diagnostic retains the actual visible host band after keyboard dismissal.
# Keep the keyboard open until the previously obscured final match is selected.
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=keyboard
- scrollUntilVisible:
    element:
      id: overlay-visible-measurement
      text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
    direction: DOWN
- takeScreenshot: autocomplete-visible-band-before-keyboard
- scrollUntilVisible:
    element:
      id: fruit-input
    direction: UP
- tapOn:
    id: fruit-input
- inputText: Ap
- scrollUntilVisible:
    element:
      text: Pineapple
    direction: DOWN
- takeScreenshot: autocomplete-final-match-with-keyboard
- tapOn: Pineapple
- assertVisible:
    id: fruit-input
    text: Pineapple
- hideKeyboard
- scrollUntilVisible:
    element:
      id: selection-count
    direction: DOWN
- assertVisible:
    id: selection-count
    text: '1'
- assertVisible:
    id: submit-count
    text: '0'
- scrollUntilVisible:
    element:
      id: overlay-resize-observation
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: autocomplete-visible-band-after-selection
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=modal-keyboard
- tapOn: Open fruit drawer
- assertVisible:
    id: overlay-visible-measurement
    text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
- takeScreenshot: drawer-visible-band-before-keyboard
- tapOn:
    id: drawer-fruit-input
- inputText: Ap
- scrollUntilVisible:
    element:
      text: Pineapple
    direction: DOWN
- takeScreenshot: drawer-final-match-with-keyboard
- tapOn: Pineapple
- assertVisible:
    id: drawer-fruit-input
    text: Pineapple
- hideKeyboard
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: drawer-visible-band-after-selection
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=command-keyboard
- scrollUntilVisible:
    element:
      id: overlay-visible-measurement
      text: 'Visible: [1-9][0-9]* to [1-9][0-9]*'
    direction: DOWN
- scrollUntilVisible:
    element:
      id: keyboard-command
    direction: UP
- tapOn: Search...
# Opening the actual mounted card must focus its input without another tap.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
# iOS can report focused=false for an active native text host. Actual typing
# without another tap plus the visible software space key verifies input focus.
- inputText: Work
- assertVisible: Work
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
# Native hierarchy visibility does not account for clipping by the results pane.
# Require the last row above the actual footer before selecting it.
- scrollUntilVisible:
    element:
      text: Work item 40
      above: to navigate
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- assertVisible: to navigate
- assertVisible: to select
- assertVisible: to close
- takeScreenshot: command-final-result-with-keyboard
# Typing after a real results drag proves that input focus was preserved.
- inputText: ' item'
- assertVisible: Work item
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- scrollUntilVisible:
    element:
      text: Work item 40
      above: to navigate
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Search work items
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: space
- assertVisible: to navigate
- assertVisible: to select
- assertVisible: to close
- tapOn:
    text: Work item 40
    above: to navigate
- hideKeyboard
- scrollUntilVisible:
    element:
      id: command-selected-index
    direction: DOWN
- assertVisible:
    id: command-query
    text: 'Query: Work item'
- assertVisible:
    id: command-selected
    text: 'Selected: Work item 40'
- assertVisible:
    id: command-selected-index
    text: 'Selected index: 39'
- assertVisible:
    id: command-selections
    text: 'Selections: 1'
- scrollUntilVisible:
    element:
      id: overlay-resize-observation
    direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: overlay-resize-observation
          text: Visible overlay height shrank
- takeScreenshot: command-selected-with-preserved-query
