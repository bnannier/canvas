appId: com.nannier.canvas.starter.smoke
name: Sealed Canvas native candidate measurement
---
- launchApp:
    clearState: true
# The router must mount before Android can deliver a warm-start link.
- assertVisible: Your workspace
- openLink: canvas-smoke:///testing/diagnostics
# iOS can require first-use confirmation before opening the app's custom scheme.
- runFlow:
    when:
      platform: iOS
      visible: 'Open in “Canvas Starter Smoke”\?'
    commands:
      - tapOn: Open
- assertVisible: Candidate runtime identity
- assertVisible:
    id: smoke-input-mode
    text: package
- assertVisible:
    id: smoke-appearance
    text: ${SCHEME}
- assertVisible:
    id: smoke-candidate-revision
    text: ${CANDIDATE}
- assertVisible:
    id: smoke-package-sha256
    text: ${PACKAGE_SHA256}
- scrollUntilVisible:
    element:
      id: smoke-package-version
    direction: DOWN
- assertVisible:
    id: smoke-package-version
    text: ${PACKAGE_VERSION}
- takeScreenshot: identity
- scrollUntilVisible:
    element:
      id: smoke-bundle-url
    direction: DOWN
- assertVisible:
    id: smoke-bundle-url
    text: (file:|assets:|/).*
- openLink: canvas-smoke:///testing/control-refs
- assertVisible: Control refs
- tapOn: Inspect refs
- assertVisible:
    id: ref-attached
    text: 'Attached: 6'
- tapOn: Measure Slider
- assertVisible:
    id: ref-measurement
    text: 'Measured: [1-9][0-9]* × [1-9][0-9]*'
- tapOn: Focus Button
- scrollUntilVisible:
    element:
      text: Focus Checkbox
    direction: UP
- tapOn: Focus Checkbox
- scrollUntilVisible:
    element:
      text: Focus Switch
    direction: UP
- tapOn: Focus Switch
- scrollUntilVisible:
    element:
      text: Focus Radio
    direction: UP
- tapOn: Focus Radio
- scrollUntilVisible:
    element:
      text: Focus Select
    direction: UP
- tapOn: Focus Select
- scrollUntilVisible:
    element:
      text: Focus Slider
    direction: UP
- tapOn: Focus Slider
- scrollUntilVisible:
    element:
      id: ref-requested
    direction: UP
- assertVisible:
    id: ref-requested
    text: 'Requested: Slider'
- assertVisible:
    id: ref-changes
    text: 'Changes: 0'
- assertNotVisible: Ref dialog
- assertNotVisible: Pear
- takeScreenshot: refs-measured-without-activation
- scrollUntilVisible:
    element:
      text: Unmount controls
    direction: UP
- tapOn: Unmount controls
- tapOn: Inspect refs
- assertVisible:
    id: ref-attached
    text: 'Attached: 0'
- tapOn: Mount controls
- tapOn: Inspect refs
- assertVisible:
    id: ref-attached
    text: 'Attached: 6'
# Exercise an unchecked Radio before the other remounted controls. These are
# ordinary taps; spoken-feedback clickability is a separate manual journey.
- scrollUntilVisible:
    element:
      text: Weekly
    direction: DOWN
- tapOn:
    text: Weekly
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: ref-changes
    direction: UP
- assertVisible:
    id: ref-changes
    text: 'Changes: 1'
- scrollUntilVisible:
    element:
      text: Disable controls
    direction: UP
- tapOn: Disable controls
- scrollUntilVisible:
    element:
      id: ref-radio
    direction: DOWN
- tapOn:
    id: ref-radio
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: ref-changes
    direction: UP
- assertVisible:
    id: ref-changes
    text: 'Changes: 1'
- takeScreenshot: radio-disabled-inert
- scrollUntilVisible:
    element:
      text: Enable controls
    direction: UP
- tapOn: Enable controls
- scrollUntilVisible:
    element:
      id: ref-radio
    direction: DOWN
- tapOn:
    id: ref-radio
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: ref-changes
    direction: UP
- assertVisible:
    id: ref-changes
    text: 'Changes: 2'
- takeScreenshot: radio-changed-once-per-tap
- scrollUntilVisible:
    element:
      id: ref-checkbox
    direction: DOWN
- tapOn:
    id: ref-checkbox
- scrollUntilVisible:
    element:
      id: ref-switch
    direction: DOWN
- tapOn:
    id: ref-switch
- scrollUntilVisible:
    element:
      id: ref-changes
    direction: UP
- assertVisible:
    id: ref-changes
    text: 'Changes: 4'
- takeScreenshot: refs-remounted-and-interactive
- openLink: canvas-smoke:///testing/form-autocomplete
- assertVisible: Form and autocomplete
- tapOn:
    id: fruit-input
- inputText: Ap
- assertVisible: Apricot
- takeScreenshot: autocomplete-open
- tapOn: Apricot
- hideKeyboard
- scrollUntilVisible:
    element:
      id: selection-count
    direction: DOWN
- assertVisible:
    id: fruit-value
    text: Apricot
- assertVisible:
    id: selection-count
    text: '1'
- assertVisible:
    id: submit-count
    text: '0'
- tapOn: Save choice
- assertVisible:
    id: submit-count
    text: '1'
- openLink: canvas-smoke:///testing/listbox
- assertVisible: Listbox input checks
- scrollUntilVisible:
    element:
      id: primary-team
    direction: DOWN
- tapOn:
    text: Frontend, Web applications
    above: Multiple selections
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: single-pick-count
    direction: DOWN
- assertVisible:
    id: single-change-count
    text: 'Changes: 1'
- assertVisible:
    id: single-pick-count
    text: 'Picks: 1'
- takeScreenshot: listbox-single-selected
- scrollUntilVisible:
    element:
      id: project-teams
    direction: DOWN
# Native layout flattening can expose a group and its rows as siblings.
# Scope the named row between the fixture's surrounding controls.
- tapOn:
    text: Frontend, Web applications
    below: Before teams
    above: After teams
- scrollUntilVisible:
    element:
      id: multi-pick-count
    direction: DOWN
- assertVisible:
    id: multi-change-count
    text: 'Changes: 1'
- assertVisible:
    id: multi-pick-count
    text: 'Picks: 1'
- takeScreenshot: listbox-selected
- scrollUntilVisible:
    element:
      id: project-teams
    direction: UP
- tapOn:
    text: Frontend, Web applications
    below: Before teams
    above: After teams
- scrollUntilVisible:
    element:
      id: multi-change-count
    direction: DOWN
- assertVisible:
    id: multi-change-count
    text: 'Changes: 2'
- assertVisible:
    id: multi-pick-count
    text: 'Picks: 2'
- openLink: canvas-smoke:///testing/listbox?disabled=true
- assertVisible: Listbox input checks
- scrollUntilVisible:
    element:
      id: primary-team
    direction: DOWN
- tapOn:
    text: Frontend, Web applications
    above: Multiple selections
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: single-pick-count
    direction: DOWN
- assertVisible:
    id: single-change-count
    text: 'Changes: 0'
- assertVisible:
    id: single-pick-count
    text: 'Picks: 0'
- scrollUntilVisible:
    element:
      id: project-teams
    direction: DOWN
- tapOn:
    text: Frontend, Web applications
    below: Before teams
    above: After teams
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: multi-pick-count
    direction: DOWN
- assertVisible:
    id: multi-change-count
    text: 'Changes: 0'
- assertVisible:
    id: multi-pick-count
    text: 'Picks: 0'
- takeScreenshot: listbox-disabled-inert
- openLink: canvas-smoke:///testing/tabs
- assertVisible: Tabs input checks
- assertVisible:
    id: tabs-selection
    text: 'Selected tab: Overview'
- tapOn:
    text: Activity
    retryTapIfNoChange: false
- assertVisible:
    id: tabs-selection
    text: 'Selected tab: Activity'
- assertVisible:
    id: tabs-change-count
    text: 'Changes: 1'
- tapOn:
    text: Unavailable
    retryTapIfNoChange: false
- assertVisible:
    id: tabs-selection
    text: 'Selected tab: Activity'
- assertVisible:
    id: tabs-change-count
    text: 'Changes: 1'
- takeScreenshot: tabs-inactive-selected-disabled-inert
- openLink: canvas-smoke:///testing/tabs?disabled=true
- assertVisible: Tabs input checks
- tapOn:
    text: Activity
    retryTapIfNoChange: false
- assertVisible:
    id: tabs-selection
    text: 'Selected tab: Overview'
- assertVisible:
    id: tabs-change-count
    text: 'Changes: 0'
- takeScreenshot: tabs-all-disabled-inert
- openLink: canvas-smoke:///testing/escape-layers?scenario=drawer
- tapOn: Open drawer
- assertVisible: Drawer content
- tapOn: Open menu
- assertVisible: Archive
- takeScreenshot: drawer-menu-before-archive
- tapOn:
    text: Archive
    retryTapIfNoChange: false
- assertNotVisible: Rename
- assertVisible: Drawer content
- assertVisible:
    id: menu-selected
    text: 'Selected: Archive'
- assertVisible:
    id: menu-select-count
    text: 'Selections: 1'
- takeScreenshot: drawer-archive-selected-once
- openLink: canvas-smoke:///testing/escape-layers?scenario=drawer-disabled
- tapOn: Open drawer
- tapOn: Open menu
- assertVisible: Archive
- tapOn:
    text: Archive
    retryTapIfNoChange: false
- assertVisible: Rename
- assertVisible: Archive
# The outside backdrop at the trigger closes the child without selecting.
- tapOn:
    text: Open menu
    retryTapIfNoChange: false
- assertNotVisible: Rename
- assertVisible: Drawer content
- assertVisible:
    id: menu-selected
    text: 'Selected: None'
- assertVisible:
    id: menu-select-count
    text: 'Selections: 0'
- takeScreenshot: drawer-archive-disabled-inert
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=modal
- tapOn: Open fruit drawer
- takeScreenshot: drawer-field-before-keyboard
- tapOn:
    id: drawer-fruit-input
- inputText: Ap
- assertVisible: Apricot
- takeScreenshot: drawer-hosted-options
- tapOn: Apricot
- assertVisible:
    id: drawer-fruit-input
    text: Apricot
- assertNotVisible: Apple
- takeScreenshot: drawer-selection
# Submit the active iOS input through its real keyboard action. A generic
# dismiss gesture cannot reach a keyboard inside this native Modal reliably.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: Return
      - assertNotVisible:
          id: space
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- openLink: canvas-smoke:///testing/form-autocomplete?scenario=action-sheet-safe-area
- tapOn: Open safe area sheet
- assertVisible: Safe area actions
- assertVisible: Choose safe area action
- takeScreenshot: action-sheet-bottom-clearance
- tapOn: Choose safe area action
- assertVisible:
    id: sheet-selections
    text: 'Selections: 1'
- assertVisible:
    id: sheet-closes
    text: 'Closes: 1'
- tapOn: Open safe area sheet
- assertVisible: Choose safe area action
- takeScreenshot: action-sheet-cancel-clearance
# The full-window scrim shares the Cancel name. Select the actual bottom row.
- tapOn:
    text: Cancel safe area sheet
    below: Choose safe area action
- assertVisible:
    id: sheet-selections
    text: 'Selections: 1'
- assertVisible:
    id: sheet-closes
    text: 'Closes: 2'
# This scenario forces glass inside the inherited light/dark scheme. Use the
# built-in Dialog body rather than custom children so description/currency paint.
- openLink: canvas-smoke:///testing/escape-layers?scenario=glass-messages
- assertVisible: Overlay keyboard checks
- tapOn:
    text: Open glass message dialog
    retryTapIfNoChange: false
- assertVisible: Glass refund details
- assertVisible: Check the refund amount and reason before continuing.
- assertVisible: Amount
- assertVisible: Reason
- assertVisible: '^\$$'
- takeScreenshot: glass-dialog-built-in-message
- tapOn:
    text: Cancel
    retryTapIfNoChange: false
- assertNotVisible: Glass refund details
- tapOn:
    text: Open glass message sheet
    retryTapIfNoChange: false
- assertVisible: Glass sharing actions
- assertVisible: Choose a sharing action for this document.
- assertVisible: Copy document link
- takeScreenshot: glass-action-sheet-header
- tapOn:
    text: Close sheet
    below: Copy document link
    retryTapIfNoChange: false
- assertNotVisible: Glass sharing actions
- openLink: canvas-smoke:///testing/carousel
- assertVisible: Native carousel paging
- assertVisible:
    id: carousel-current
    text: 'Current page: 2'
- assertVisible:
    id: carousel-changes
    text: 'Page changes: 0'
- assertVisible: Slide 2 of 6, current slide
- assertVisible:
    id: carousel-page-2
- takeScreenshot: carousel-default-page
- assertVisible:
    id: carousel-measurement
    text: '.*"generation":0,"status":"idle".*'
- tapOn: Measure current slide
- assertVisible:
    id: carousel-measurement
    text: '.*"generation":1,"status":"ready".*'
# The runner appends an attempt-specific validated console measurement record.
# Its continuation remeasures the same current slide before the literal drag.
