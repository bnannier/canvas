version: 2
updates:
  # GitHub Actions used by the CI / deploy workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # No npm ecosystems on purpose: this repo uses bun.lock, which Dependabot does not
  # resolve, so its npm PRs change package.json without the lockfile and every one
  # fails CI at `bun install --frozen-lockfile` (wasted red runs on a metered private
  # repo). Dependency freshness comes from running `bun update` locally; Dependabot
  # SECURITY ALERTS are unaffected (they are separate from version-update PRs).
