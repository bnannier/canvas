name: Deploy to TestFlight

# Reusable iOS deploy: EAS-builds the docs app (production profile) and submits it to TestFlight.
# Invoked by the deploy.yml button and independently runnable via its own "Run workflow".
#
# ONE-TIME SETUP to activate (until done, the gate SKIPS green with a notice):
#   1. EXPO_TOKEN repo secret (expo.dev -> account settings -> Access Tokens).
#   2. iOS distribution cert + provisioning profile on EAS: run `eas build -p ios --profile
#      production` once locally; the Apple login generates them plus the App Store Connect app record.
#   3. An App Store Connect API key on EAS (`eas credentials -p ios` -> App Store Connect API Key),
#      so `eas submit` runs unattended here.
# The build number auto-increments remotely (eas.json appVersionSource: remote).
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    # If EXPO_TOKEN is absent, skip the deploy with a warning (not a red build), so an
    # un-configured repo isn't a failed deploy.
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TestFlight deploy skipped: set the EXPO_TOKEN secret and configure iOS credentials + an App Store Connect API key on EAS to enable it (see this workflow's header)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The native app consumes the source-only kit + the generated docs core through symlinks
      # (docs postinstall), so install root deps and regenerate the docs core before the EAS build.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Regenerate docs core
        run: bun run docs:gen

      - name: Install docs deps
        working-directory: docs
        run: bun install

      - name: EAS build (iOS, production) and submit to TestFlight
        working-directory: docs
        run: eas build --platform ios --profile production --non-interactive --auto-submit
