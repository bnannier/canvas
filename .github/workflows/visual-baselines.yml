name: Visual baselines — canvas

# Mints the screenshot baselines the `visual` project compares against.
#
# They have to come from a Linux runner. macOS renders the same DOM with different
# glyph metrics, so a baseline taken there disagrees with CI by whole pixels on every
# shot, for reasons that are not defects. Rather than keep two sets, or loosen the
# tolerance until it stops catching anything, the baselines are Linux-only and the
# visual project simply does not compare anywhere else.
#
# Deliberately manual, and deliberately not a commit. It uploads the images; a person
# runs `bun run e2e:baselines:pull <run-id>`, looks at what changed, and commits. A
# job that rewrote its own baselines would turn every regression into a new baseline.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to update (leave as "visual")'
        default: visual
        required: false

concurrency:
  group: visual-baselines
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install chromium
        run: bunx playwright install --with-deps chromium

      # The same export the e2e job tests, built the same way the deploy builds it.
      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Export web build
        working-directory: docs
        run: bun run build:web

      - name: Mint the baselines
        # Always capture current pixels for review. The bare flag updates only
        # screenshots that exceed the comparison tolerance in Playwright 1.60.
        # The input reaches the script through env, never through `${{ }}` inside it,
        # where any text would run as shell, and it must name a project defined in
        # playwright.config.ts (read from the config itself, so the check cannot drift).
        env:
          PROJECT: ${{ inputs.project || 'visual' }}
        run: |
          projects=$(bun -e 'const { default: config } = await import("./playwright.config.ts"); for (const project of config.projects ?? []) console.log(project.name)')
          # An exact comparison per name: a pattern match would accept a value that
          # only contains a project name on one of its lines.
          known=false
          while IFS= read -r project; do
            if [ "$project" = "$PROJECT" ]; then known=true; fi
          done <<< "$projects"
          if [ "$known" != true ]; then
            printf '::error::project must be one of the Playwright projects in playwright.config.ts (%s), not %q\n' "$(printf '%s' "$projects" | tr '\n' ',' | sed 's/,/, /g')" "$PROJECT"
            exit 1
          fi
          bunx playwright test --project="$PROJECT" --update-snapshots=all

      - name: Upload them
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/visual/__screenshots__
          retention-days: 14

      - name: Summary
        run: |
          count=$(find e2e/visual/__screenshots__ -name '*.png' | wc -l | tr -d ' ')
          size=$(du -sh e2e/visual/__screenshots__ | cut -f1)
          {
            echo "### Visual baselines"
            echo
            echo "$count screenshots, $size."
            echo
            echo 'Pull them with `bun run e2e:baselines:pull ${{ github.run_id }}`, review the diff, and commit.'
          } >> "$GITHUB_STEP_SUMMARY"
