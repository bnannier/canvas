name: E2E soak (canvas)

# Reproduces a rare end-to-end failure on the Linux runner, where CI meets it and a
# laptop does not. Deliberately manual, and it changes nothing: it uploads reports.
#
# The suite runs with no retries (playwright.config.ts), so a test that fails one run
# in ten is a defect to find, not to rerun. Some of those appear only on this runner,
# in a browser that has lived through a whole shard: the glass material captures that
# hung in Chromium's Page.captureScreenshot a few Deploy runs in thirty (2026-09)
# passed a hundred times in a row when replayed alone, and this soak is what found and
# proved their fix (CHROMIUM_ARGS in playwright.config.ts). So this replays a spec, or
# a directory of them such as a project's whole journey set, in order, several passes
# per lane (each pass is the whole selection in the order a shard runs it, in fresh
# workers), on parallel lanes, against a fresh export, with
# the hang probe armed (e2e/support/hang-probe.ts): a test still running after
# `hang_probe_ms` gets the browser's state attached to its report (a Chromium renderer's
# with a compositor trace; for Firefox and WebKit whether the page still answers a new
# evaluation), and DEBUG=pw:browser puts each browser's own log beside the running test.
# Every material test finishes in under 25 s on this runner, so the default 40 s probes
# only a stuck one; a spec whose stuck step gives up sooner (gotoDocs waits 20 s for the
# page to paint) needs a lower value, or the test fails before the probe runs. `project`
# takes any project in playwright.config.ts, the cross-engine journeys included, and the
# lane installs only the browser that project runs. `browsers: shared` runs every pass in
# the same workers and browsers; `fresh` makes each pass its own run, so every pass meets
# its first tests in newly launched browsers, the moment a shard reaches a project (the
# Firefox paint check that never got an answer, 2026-09-25, struck a worker's second
# test, while four Firefoxes had just started). `protocol_events: on` attaches to each
# failed test the execution contexts created, destroyed and cleared, the navigations,
# and every evaluation with whether it was answered, from Playwright's own protocol log.
#
# A browser that crashes outright leaves only "Target page, context or browser has been
# closed" in the report. `crash_dumps: on` keeps the whole core dump with a gdb report of
# the fault and every thread's stack (scripts/soak-crash-dumps.mjs; Playwright's Firefox
# has no crash reporter of its own), and every lane keeps the kernel's line for a
# process a fault killed outright, which Firefox's parent never is: it catches SIGSEGV
# itself and re-raises it, so its crashes are only in the core. It was built for the
# Firefox parent's rare SIGSEGV in the Firefox journeys (3 in 731,080 tests, 2026-09).
# The one it caught (soak 36205920903, lane 9) is a use-after-free in Playwright's own
# Firefox patch, which stock Firefox does not have: the headless compositor widget swaps
# and releases its draw target on the compositor thread when Playwright resizes a window,
# while WebRender's render thread reads and AddRefs the same pointer with no lock. The
# other two left no core and are consistent with it, not proven the same. The docs pages
# do not cause it; how busy a page keeps the compositor only changes the odds.
# The soak job holds no secrets (contents: read, none referenced), which is what lets a
# core, holding the process environment and memory, sit in this public repository's
# artifacts; keep it that way.
#
# `ref` replays another commit of this repository with this workflow, to learn whether
# a failure seen there still happens (a commit older than the probe runs without it;
# Playwright's own trace and error context still land in the report). `trace`, `channel`
# and `chromium_args` test a hypothesis about the browser: they reach the run through
# playwright.soak.config.ts, never the configuration every other run uses; `pacing`
# drops the suite's own switches and `playwright` soaks another release, both to tell
# whether a newer Chromium still needs them. Soaks run side by side, so two hypotheses
# about one commit can be compared at once.
#
# Every input reaches the shell through `env`, never through `${{ }}` inside a script,
# and the spec path is checked before use.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The commit to replay (empty for the dispatched one)'
        default: ''
        type: string
      lanes:
        description: 'Parallel lanes, each its own runner'
        default: '8'
        type: choice
        options:
          - '4'
          - '8'
          - '12'
          - '16'
      spec:
        description: 'What to replay: an e2e/**/*.e2e.ts spec, or a directory of specs under e2e/ (the project still picks which of them run)'
        default: e2e/visual/materials.e2e.ts
        type: string
      grep:
        description: 'Only the tests whose title matches this regular expression (empty for all)'
        default: ''
        type: string
      passes:
        description: 'Passes over the selection per lane (Playwright --repeat-each, or one run per pass with fresh browsers)'
        default: 5
        type: number
      browsers:
        description: 'shared: every pass in the same workers and browsers (--repeat-each); fresh: each pass its own run, so every pass starts new workers and browsers the way a shard meets its first tests'
        default: shared
        type: choice
        options:
          - shared
          - fresh
      project:
        description: 'Playwright project'
        default: visual
        type: choice
        options:
          - visual
          - smoke
          - responsive
          - behavior
          - a11y
          - journeys-chromium
          - journeys-firefox
          - journeys-webkit
          - touch-chromium
          - touch-webkit
      hang_probe_ms:
        description: 'Probe a test still running this many milliseconds after it started (e2e/support/hang-probe.ts); set it below the step that hangs times out'
        default: 40000
        type: number
      protocol_events:
        description: "Attach to each failed test the protocol events that decide which JavaScript worlds Playwright can reach (e2e/support/protocol-events.ts)"
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
      crash_dumps:
        description: "Keep a core dump of every process that crashes during the replay, with a gdb report of its threads' stacks (scripts/soak-crash-dumps.mjs); the lane first proves the capture on a browser it crashes itself"
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
      trace:
        description: 'Playwright tracing (the suite keeps traces of failures; off also stops the screencast a trace records)'
        default: retain-on-failure
        type: choice
        options:
          - retain-on-failure
          - 'off'
      channel:
        description: 'Chromium build: the headless shell Playwright launches by default, or full Chromium in new headless mode'
        default: headless-shell
        type: choice
        options:
          - headless-shell
          - chromium
      chromium_args:
        description: 'Extra Chromium switches for the Chromium projects, space separated (playwright.soak.config.ts)'
        default: ''
        type: string
      pacing:
        description: "Frame pacing: the suite's own switches (CHROMIUM_ARGS in playwright.config.ts), or Chromium's default"
        default: suite
        type: choice
        options:
          - suite
          - chromium-default
      playwright:
        description: 'Another Playwright release to soak with, e.g. 1.63.0 or 1.64.0-alpha-2026-09-25, installed on the runner only (empty for the lockfile one)'
        default: ''
        type: string

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - id: lanes
        env:
          LANES: ${{ inputs.lanes }}
        run: echo "lanes=[$(seq -s, 1 "$LANES")]" >> "$GITHUB_OUTPUT"

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      # The same export the e2e job tests, built the way the deploy builds it.
      - name: Export web build
        working-directory: docs
        run: bun run build:web

      - name: Hand the export to the lanes
        uses: actions/upload-artifact@v7
        with:
          name: soak-docs-dist
          path: docs/dist
          retention-days: 1

  soak:
    needs: [plan, export]
    runs-on: ubuntu-latest
    # Five passes of the material spec take about 45 minutes on a lane; each hang
    # costs two more (the test and its teardown both run out their 60 s).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check the spec path
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          # A spec file, or a directory with no dots in its path (so never `..`).
          if [[ "$SPEC" =~ ^e2e/[A-Za-z0-9/_.-]+\.e2e\.ts$ ]]; then
            test -f "$SPEC" || { printf '::error::%q does not exist\n' "$SPEC"; exit 1; }
          elif [[ "$SPEC" =~ ^e2e(/[A-Za-z0-9_-]+)*/?$ ]]; then
            test -d "$SPEC" || { printf '::error::%q is not a directory\n' "$SPEC"; exit 1; }
          else
            printf '::error::spec must be an e2e/**/*.e2e.ts path or a directory under e2e/, not %q\n' "$SPEC"; exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # On this runner only: nothing is committed, and the export was built above
      # with the lockfile's dependencies.
      - name: Use another Playwright release
        if: inputs.playwright != ''
        env:
          PLAYWRIGHT_VERSION: ${{ inputs.playwright }}
        run: |
          # A release (1.63.0) or a prerelease (1.64.0-alpha-2026-09-25, 1.63.0-beta-1789413634000).
          if ! [[ "$PLAYWRIGHT_VERSION" =~ ^1\.[0-9]+\.[0-9]+(-(alpha|beta)-[0-9][0-9-]*)?$ ]]; then
            printf '::error::playwright must be a release like 1.63.0 or a prerelease like 1.64.0-alpha-2026-09-25, not %q\n' "$PLAYWRIGHT_VERSION"; exit 1
          fi
          # Both packages, so the CLI that installs and launches the browsers is the same
          # release as the test runner.
          bun add --dev --exact "@playwright/test@$PLAYWRIGHT_VERSION" "playwright@$PLAYWRIGHT_VERSION"
          installed=$(bunx playwright --version)
          echo "$installed"
          [ "$installed" = "Version $PLAYWRIGHT_VERSION" ] || { printf '::error::bunx playwright reports %q, not %q\n' "$installed" "$PLAYWRIGHT_VERSION"; exit 1; }

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Only the engine the project runs: the journeys and the touch projects run on
      # Firefox and WebKit too (playwright.config.ts), everything else on Chromium.
      - name: Install the project's browser
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          case "$PROJECT" in
            visual | smoke | responsive | behavior | a11y | journeys-chromium | touch-chromium) browser=chromium ;;
            journeys-firefox) browser=firefox ;;
            journeys-webkit | touch-webkit) browser=webkit ;;
            *) printf '::error::no browser is known for project %q\n' "$PROJECT"; exit 1 ;;
          esac
          bunx playwright install --with-deps "$browser"
          echo "SOAK_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Take the export
        uses: actions/download-artifact@v8
        with:
          name: soak-docs-dist
          path: docs/dist

      # A crashed browser leaves nothing but the kernel's core dump (Playwright's Firefox
      # has no crash reporter of its own), and only where kernel.core_pattern names a
      # writable place and the core size limit allows it, which Replay lifts for its own
      # processes. The self-test crashes a browser of the project's engine first and puts
      # its core through everything "Keep the crashes" does, so a lane whose capture
      # cannot work fails here instead of after an hour of replay.
      - name: Arm core dumps
        if: inputs.crash_dumps == 'on'
        run: |
          mkdir -p "$RUNNER_TEMP/cores" crash-reports
          # %P is the pid Playwright's browser log prints, %e the crashing thread's name.
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/cores/core.%P.%e"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gdb
          ulimit -c unlimited
          node scripts/soak-crash-dumps.mjs self-test "$SOAK_BROWSER" "$RUNNER_TEMP/cores" crash-reports

      - name: Replay
        env:
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
          PASSES: ${{ inputs.passes }}
          BROWSERS: ${{ inputs.browsers }}
          PROJECT: ${{ inputs.project }}
          TRACE: ${{ inputs.trace }}
          E2E_SOAK_CHANNEL: ${{ inputs.channel == 'chromium' && 'chromium' || '' }}
          E2E_SOAK_CHROMIUM_ARGS: ${{ inputs.chromium_args }}
          E2E_SOAK_DEFAULT_PACING: ${{ inputs.pacing == 'chromium-default' && '1' || '' }}
          E2E_HANG_PROBE_MS: ${{ inputs.hang_probe_ms }}
          E2E_PROTOCOL_EVENTS: ${{ inputs.protocol_events == 'on' && '1' || '' }}
          CRASH_DUMPS: ${{ inputs.crash_dumps }}
          DEBUG: pw:browser
        run: |
          # The limit holds for this shell's children: the test runner, its workers and
          # every browser they launch.
          if [ "$CRASH_DUMPS" = on ]; then ulimit -c unlimited; fi
          # At most seven digits: a timer holds 2^31 - 1 ms and fires at once past it.
          if ! [[ "$E2E_HANG_PROBE_MS" =~ ^[1-9][0-9]{0,6}$ ]]; then
            printf '::error::hang_probe_ms must be a whole number of milliseconds under 10000000, not %q\n' "$E2E_HANG_PROBE_MS"; exit 1
          fi
          if ! [[ "$PASSES" =~ ^[1-9][0-9]{0,3}$ ]]; then
            printf '::error::passes must be a whole number from 1 to 9999, not %q\n' "$PASSES"; exit 1
          fi
          set -- "$SPEC" -c playwright.soak.config.ts --project="$PROJECT" --trace="$TRACE" --reporter=list,html
          if [ -n "$GREP" ]; then set -- "$@" --grep "$GREP"; fi
          if [ "$BROWSERS" = shared ]; then
            bunx playwright test "$@" --repeat-each="$PASSES"
            exit
          fi
          # One run per pass. A passing run's report is dropped and a failing one kept
          # under its pass number, so the lane uploads the failures' evidence only.
          failed=0
          for pass in $(seq 1 "$PASSES"); do
            if PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/pass-$pass" bunx playwright test "$@" --output="test-results/pass-$pass"; then
              rm -rf "playwright-report/pass-$pass" "test-results/pass-$pass"
            else
              failed=$((failed + 1))
            fi
          done
          echo "$failed of $PASSES fresh-browser passes failed"
          [ "$failed" -eq 0 ]

      # The kernel logs a process a fault killed with no handler of its own in the way,
      # as "firefox[4201]: segfault at 0 ip ... error 6 in libxul.so[2a3c10d,7f3c...]"
      # and a line of the code around it: the thread, the address it touched, and the
      # module and offset of the instruction (a content process, say; Firefox's parent
      # catches the fault and re-raises it, which the kernel does not log). Reading the
      # log changes nothing, so every lane keeps those lines. With crash_dumps on, each
      # core the replay left is kept, compressed, with its gdb report and the Playwright
      # browser build that wrote it (scripts/soak-crash-dumps.mjs `keep`).
      - name: Keep the crashes
        if: always()
        env:
          CRASH_DUMPS: ${{ inputs.crash_dumps }}
        run: |
          mkdir -p crash-reports
          kernel=$(sudo dmesg)
          if grep -E -A1 'segfault at|traps:|general protection' <<< "$kernel" > crash-reports/kernel.txt; then
            cat crash-reports/kernel.txt
          else
            echo "The kernel logged no fault on this lane."
          fi
          [ "$CRASH_DUMPS" = on ] || exit 0
          node scripts/soak-crash-dumps.mjs keep "$RUNNER_TEMP/cores" crash-reports

      - name: Upload the lane's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-report-lane-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/
            crash-reports/
          retention-days: 7
