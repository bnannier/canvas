name: E2E soak (canvas)

# Reproduces a rare end-to-end failure on the Linux runner, where CI meets it and a
# laptop does not. Deliberately manual, and it changes nothing: it uploads reports.
#
# The suite runs with no retries (playwright.config.ts), so a test that fails one run
# in ten is a defect to find, not to rerun. Some of those appear only on this runner,
# in a browser that has lived through a whole shard: the glass material captures that
# hung in Chromium's Page.captureScreenshot a few Deploy runs in thirty (2026-09)
# passed a hundred times in a row when replayed alone, and this soak is what found and
# proved their fix (CHROMIUM_ARGS in playwright.config.ts). So this replays a spec in
# order, several passes per lane (each pass is the whole selection in the order a
# shard runs it, in fresh workers), on parallel lanes, against a fresh export, with
# the hang probe armed (e2e/support/hang-probe.ts): a test still running after
# `hang_probe_ms` gets the browser's state attached to its report (a Chromium renderer's
# with a compositor trace; for Firefox and WebKit whether the page still answers a new
# evaluation), and DEBUG=pw:browser puts each browser's own log beside the running test.
# Every material test finishes in under 25 s on this runner, so the default 40 s probes
# only a stuck one; a spec whose stuck step gives up sooner (gotoDocs waits 20 s for the
# page to paint) needs a lower value, or the test fails before the probe runs. `project`
# takes any project in playwright.config.ts, the cross-engine journeys included, and the
# lane installs only the browser that project runs.
#
# `ref` replays another commit of this repository with this workflow, to learn whether
# a failure seen there still happens (a commit older than the probe runs without it;
# Playwright's own trace and error context still land in the report). `trace`, `channel`
# and `chromium_args` test a hypothesis about the browser: they reach the run through
# playwright.soak.config.ts, never the configuration every other run uses; `pacing`
# drops the suite's own switches and `playwright` soaks another release, both to tell
# whether a newer Chromium still needs them. Soaks run side by side, so two hypotheses
# about one commit can be compared at once.
#
# Every input reaches the shell through `env`, never through `${{ }}` inside a script,
# and the spec path is checked before use.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The commit to replay (empty for the dispatched one)'
        default: ''
        type: string
      lanes:
        description: 'Parallel lanes, each its own runner'
        default: '8'
        type: choice
        options:
          - '4'
          - '8'
          - '12'
          - '16'
      spec:
        description: 'The spec to replay, an e2e/**/*.e2e.ts path'
        default: e2e/visual/materials.e2e.ts
        type: string
      grep:
        description: 'Only the tests whose title matches this regular expression (empty for all)'
        default: ''
        type: string
      passes:
        description: 'Passes over the selection per lane (Playwright --repeat-each)'
        default: 5
        type: number
      project:
        description: 'Playwright project'
        default: visual
        type: choice
        options:
          - visual
          - smoke
          - responsive
          - behavior
          - a11y
          - journeys-chromium
          - journeys-firefox
          - journeys-webkit
          - touch-chromium
          - touch-webkit
      hang_probe_ms:
        description: 'Probe a test still running this many milliseconds after it started (e2e/support/hang-probe.ts); set it below the step that hangs times out'
        default: 40000
        type: number
      trace:
        description: 'Playwright tracing (the suite keeps traces of failures; off also stops the screencast a trace records)'
        default: retain-on-failure
        type: choice
        options:
          - retain-on-failure
          - 'off'
      channel:
        description: 'Chromium build: the headless shell Playwright launches by default, or full Chromium in new headless mode'
        default: headless-shell
        type: choice
        options:
          - headless-shell
          - chromium
      chromium_args:
        description: 'Extra Chromium switches for the Chromium projects, space separated (playwright.soak.config.ts)'
        default: ''
        type: string
      pacing:
        description: "Frame pacing: the suite's own switches (CHROMIUM_ARGS in playwright.config.ts), or Chromium's default"
        default: suite
        type: choice
        options:
          - suite
          - chromium-default
      playwright:
        description: 'Another @playwright/test release to soak with, e.g. 1.63.0, installed on the runner only (empty for the lockfile one)'
        default: ''
        type: string

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - id: lanes
        env:
          LANES: ${{ inputs.lanes }}
        run: echo "lanes=[$(seq -s, 1 "$LANES")]" >> "$GITHUB_OUTPUT"

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      # The same export the e2e job tests, built the way the deploy builds it.
      - name: Export web build
        working-directory: docs
        run: bun run build:web

      - name: Hand the export to the lanes
        uses: actions/upload-artifact@v7
        with:
          name: soak-docs-dist
          path: docs/dist
          retention-days: 1

  soak:
    needs: [plan, export]
    runs-on: ubuntu-latest
    # Five passes of the material spec take about 45 minutes on a lane; each hang
    # costs two more (the test and its teardown both run out their 60 s).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check the spec path
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          if ! [[ "$SPEC" =~ ^e2e/[A-Za-z0-9/_.-]+\.e2e\.ts$ ]]; then
            printf '::error::spec must be an e2e/**/*.e2e.ts path, not %q\n' "$SPEC"; exit 1
          fi
          test -f "$SPEC" || { printf '::error::%q does not exist\n' "$SPEC"; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # On this runner only: nothing is committed, and the export was built above
      # with the lockfile's dependencies.
      - name: Use another Playwright release
        if: inputs.playwright != ''
        env:
          PLAYWRIGHT_VERSION: ${{ inputs.playwright }}
        run: |
          if ! [[ "$PLAYWRIGHT_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::playwright must be a release like 1.63.0, not %q\n' "$PLAYWRIGHT_VERSION"; exit 1
          fi
          bun add --dev --exact "@playwright/test@$PLAYWRIGHT_VERSION"
          bunx playwright --version

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Only the engine the project runs: the journeys and the touch projects run on
      # Firefox and WebKit too (playwright.config.ts), everything else on Chromium.
      - name: Install the project's browser
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          case "$PROJECT" in
            visual | smoke | responsive | behavior | a11y | journeys-chromium | touch-chromium) browser=chromium ;;
            journeys-firefox) browser=firefox ;;
            journeys-webkit | touch-webkit) browser=webkit ;;
            *) printf '::error::no browser is known for project %q\n' "$PROJECT"; exit 1 ;;
          esac
          bunx playwright install --with-deps "$browser"

      - name: Take the export
        uses: actions/download-artifact@v8
        with:
          name: soak-docs-dist
          path: docs/dist

      - name: Replay
        env:
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
          PASSES: ${{ inputs.passes }}
          PROJECT: ${{ inputs.project }}
          TRACE: ${{ inputs.trace }}
          E2E_SOAK_CHANNEL: ${{ inputs.channel == 'chromium' && 'chromium' || '' }}
          E2E_SOAK_CHROMIUM_ARGS: ${{ inputs.chromium_args }}
          E2E_SOAK_DEFAULT_PACING: ${{ inputs.pacing == 'chromium-default' && '1' || '' }}
          E2E_HANG_PROBE_MS: ${{ inputs.hang_probe_ms }}
          DEBUG: pw:browser
        run: |
          if ! [[ "$E2E_HANG_PROBE_MS" =~ ^[1-9][0-9]*$ ]]; then
            printf '::error::hang_probe_ms must be a whole number of milliseconds, not %q\n' "$E2E_HANG_PROBE_MS"; exit 1
          fi
          set -- "$SPEC" -c playwright.soak.config.ts --project="$PROJECT" --repeat-each="$PASSES" --trace="$TRACE" --reporter=list,html
          if [ -n "$GREP" ]; then set -- "$@" --grep "$GREP"; fi
          bunx playwright test "$@"

      - name: Upload the lane's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-report-lane-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
