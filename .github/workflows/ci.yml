name: CI - canvas

# Main pushes use Deploy's identical validation contract before publication.
# No path filters: a newer test/docs/workflow-only change must not strand a release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
