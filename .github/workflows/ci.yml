name: CI — canvas

# The single per-push validation pipeline: library checks + docs build in ONE job, so
# runner spin-up (checkout, setup-bun, root install) and docgen happen once per run.
# Deploys never run from here; they live behind the manual deploy.yml button.
on:
  push:
    # main only: branch work gets CI through its pull request instead, so a Dependabot
    # branch push no longer runs CI twice. Also keeps tag pushes from triggering CI
    # (paths filters are not evaluated for tag pushes).
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'docs/**'
      - 'tools/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'test/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.changeset/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'docs/**'
      - 'tools/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'test/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.changeset/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Only the newest tip of a ref needs to be green; superseded runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Library checks first (cheap, fail fast), then the docs app build. The published
  # package is the COMPILED dist (ES modules + .d.ts from tsconfig.build.json), so CI
  # builds it, verifies the artifact is consumable (specifier resolution, platform
  # forks, no raw TS, no DOM-typed public surface), and smoke-renders components FROM
  # dist in the test suite (test/dist-smoke.test.tsx).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-bun does not cache installs. Bun's global content-addressable download
      # cache serves BOTH the root and docs installs, so one entry covers them.
      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Playwright transpiles TypeScript without type-checking it, and the root
      # project includes only src/**, so without this the whole e2e tree would ship
      # its type errors to runtime.
      - name: Typecheck the end-to-end suite
        run: bun run typecheck:e2e

      # One flat config at the repo root covers every hand-written source tree, the docs
      # app included, so this single run is the real lint gate. The docs workspace runs
      # its own script further down for a different reason (see there).
      - name: Lint
        run: bun run lint

      - name: Build package (dist)
        run: bun run build

      - name: Verify package artifact
        run: bun run verify-package

      - name: Unit tests
        run: bun test

      # Runs docgen ONCE for the whole pipeline and fails on ANY drift under
      # docs/src/core (tracked or untracked), so a breaking prop change or a forgotten
      # `bun run docs:gen` is caught here, and the docs steps below consume a validated
      # docs core with no rerun.
      - name: Check generated docs core is up to date
        run: bun run docs:gen:check

      # Coverage gate for the native iOS menu glyph rasters: every nav glyph must have a
      # bundled PNG + map entry, so a forgotten `bun run raster:gen` after a nav-icon change
      # is caught. Coverage only (not PNG bytes), since sharp output can differ macOS<->CI.
      - name: Check menu-glyph rasters are up to date
        run: bun run raster:gen:check

      - name: Validate theme tokens
        run: bun run validate-tokens

      - name: Check parity with the design hand-off
        run: bun run check-parity:check

      # Renders the hand-off's own colour cards and compares the painted pixels. The other two
      # colour guards compare files that both live behind this commit, so they can only prove the
      # kit is internally consistent; this one reads the hand-off. Note it runs against the VENDORED
      # copy here, which is itself behind this commit — the authoritative leg is the local run
      # against the real export.
      - name: Install chromium for the render check
        run: bunx playwright install --with-deps chromium

      - name: Check rendered colours against the hand-off
        run: bun run check-render

      - name: Check CSS + JS size budgets
        run: bun run check-size

      # --- Docs app (the universal RN app the Pages deploy ships) ---

      # docs consumes the source-only kit + the generated docs core as live symlinks
      # (docs postinstall), which is why the root install above must come first.
      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      # The /licenses screen carries obligations, not decoration: MIT requires its notice
      # to ship with the software and OFL-1.1 requires the same for the bundled Geist
      # typefaces. This fails if a dependency changed without re-running `notices:gen`,
      # so the notices cannot fall silently out of step with what the app ships. It reads
      # tools/noticegen/shipped.json and never runs an export, so it stays CI-fast.
      #
      # MUST run after the docs install: the generator reads each package's LICENSE from
      # docs/node_modules first and the workspace root second. With docs deps absent it
      # resolves a different set and reports a false "stale", which is exactly how it
      # failed the first time it ran here.
      - name: Check third-party licence notices are up to date
        run: bun run notices:gen:check

      # The root Lint step above already lints docs/src. This runs the docs workspace's
      # OWN script, which is the only thing that catches it breaking: `expo lint` hands
      # ESLint the docs/src path, and ESLint 9 exits 2 when every path it is handed is
      # ignored. That is exactly how this script sat broken and unnoticed, since nothing
      # in CI ever invoked it.
      - name: Lint docs workspace script
        working-directory: docs
        run: bun run lint

      # The single nav source of truth (nav.config.json) must stay 1:1 with the
      # generated docs core data.
      - name: Check nav config is in sync
        working-directory: docs
        run: bun run check:nav

      # A component that ships per-OS skins must be in the docs' platform-skin
      # registry, or the three-up preview renders the web build in all three rows
      # while labelling two of them iOS and Android.
      - name: Check the platform-skin registry covers every divergent skin
        working-directory: docs
        run: bun run check:skins

      # docs/tsconfig.json includes docs/src/core/** and maps @nannier-com/canvas to
      # ../src/index.ts, so this also typechecks every generated example against the
      # real component prop types.
      - name: Typecheck docs (includes generated examples)
        working-directory: docs
        run: bunx tsc --noEmit

      # Kept per-push: it is the only check that catches CI-only Metro/export bugs
      # before a Pages deploy trips over them. `build:web` is what deploy.yml runs, so
      # this exercises the shipping configuration exactly, including the two
      # post-processors (font preloads, inlined stylesheet) that `expo export` alone
      # never reaches. It used to export under EXPO_BASE_URL=/canvas to match a Pages
      # deploy that no longer exists: deploy.yml sets no base URL, since the site is
      # served from the root of canvas.nannier.com, so CI was validating a build nobody
      # ships. Node comes from the runner image.
      - name: Export web build
        working-directory: docs
        run: bun run build:web

      # The end-to-end job runs against these exact bytes rather than exporting again,
      # so what it tests is what this job validated. Nothing reads the artifact after
      # the run finishes, hence the one-day retention.
      - name: Upload the web export for the end-to-end job
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 1

  # Browser work is slow next to the library checks, and it fails for different
  # reasons, so it gets its own job and its own red box rather than quadrupling the
  # two-minute `check`. It needs `check` only for the export artifact; if this grows
  # past roughly eight minutes, split it with a `--project` matrix (the projects in
  # playwright.config.ts are already independent).
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The same key as `check`: bun's download cache is content-addressable, so one
      # entry serves both jobs.
      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Chromium is ~130 MB to download and never changes for a given Playwright
      # version, which bun.lock pins.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install chromium
        run: bunx playwright install --with-deps chromium

      # Not a fresh export: these are the bytes `check` already validated.
      - name: Download the web export
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/dist

      - name: End-to-end suite
        run: bunx playwright test --reporter=github,html

      # Only on failure: the report carries the traces, the failure screenshots and,
      # once the visual project lands, the expected/actual/diff images.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
