name: CI — canvas

on:
  push:
    paths:
      - 'src/**'
      - 'styles/**'
      - 'docs/**'
      - 'docs-core/**'
      - 'tools/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'test/**'
      - '.changeset/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Library checks: the published package is source-shipped (src + styles), so CI
  # validates it compiles, exports resolve, and the single Tailwind v4 stylesheet
  # (styles/canvas.css) is sound.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The docs example modules are generated from each component's .md fences
      # (tools/docgen). Fail if the committed output is stale, then type-check every
      # generated fence against the real component prop types, so a breaking prop
      # change or a forgotten `bun run docs:gen` is caught here, not at native build.
      - name: Check generated docs examples are up to date
        run: bun run docs:gen:check

      - name: Typecheck generated docs examples
        run: bunx tsc --noEmit -p docs-core/tsconfig.json

      - name: Verify package exports
        run: bun -e "import { cn, getTheme, token } from './src/index.ts'; console.log('JS exports OK')"

      - name: Validate theme tokens
        run: bun run validate-tokens

      - name: Check CSS size budget
        run: bun run check-size

      - name: Check for duplicate class definitions
        run: bun run check-duplicates

  # Docs build: the same Vite bundle the Pages deploy ships, so a broken docs
  # build fails CI before it can be deployed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Canvas deps (for type resolution)
        run: bun install --frozen-lockfile

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Typecheck docs
        working-directory: docs
        run: bunx tsc --noEmit

      - name: Build docs
        working-directory: docs
        run: bun run build
        env:
          VITE_BASE_PATH: /canvas/
