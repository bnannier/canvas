name: CI — canvas

on:
  push:
    paths:
      - 'src/**'
      - 'styles/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'test/**'
      - '.changeset/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Verify CSS entry point resolves all imports
        run: |
          missing=0
          while IFS= read -r line; do
            file=$(echo "$line" | sed -n 's/.*@import "\(.*\)".*/\1/p')
            if [ -n "$file" ]; then
              resolved="styles/$file"
              if [ ! -f "$resolved" ]; then
                echo "Missing: $resolved (from styles/canvas.css)"
                missing=$((missing + 1))
              fi
            fi
          done < styles/canvas.css
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing CSS import(s) could not be resolved."
            exit 1
          fi
          echo "All CSS imports resolve."

      - name: Verify utilities are in sync with the generator
        run: |
          bun run generate-utilities
          if ! git diff --quiet --exit-code styles/utilities/; then
            echo "ERROR: styles/utilities/ is out of sync with scripts/generate-utilities.ts."
            echo "Run 'bun run generate-utilities' and commit the result."
            git diff --stat styles/utilities/
            exit 1
          fi
          echo "Utilities are in sync with the generator."

      - name: Verify package exports
        run: bun -e "import { cn, getTheme, token } from './src/index.ts'; console.log('JS exports OK')"

      - name: Validate tokens
        run: bun run validate-tokens

      - name: Check CSS size budget
        run: bun run check-size

      - name: Check color contrast (WCAG AA)
        run: bun scripts/check-contrast.ts

      - name: Visual regression screenshots
        run: |
          bun x playwright install --with-deps chromium
          bun run screenshots
