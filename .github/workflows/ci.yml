name: CI — canvas

on:
  push:
    paths:
      - 'src/**'
      - 'styles/**'
      - 'docs/**'
      - 'tools/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'test/**'
      - '.changeset/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Library checks: the published package is the COMPILED dist (ES modules +
  # .d.ts from tsconfig.build.json), so CI builds it, verifies the artifact is
  # consumable (specifier resolution, platform forks, no raw TS, no DOM-typed
  # public surface), and smoke-renders components FROM dist in the test suite.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build package (dist)
        run: bun run build

      - name: Verify package artifact
        run: bun run verify-package

      # Includes test/dist-smoke.test.tsx, which imports and renders components
      # from the freshly built dist — the consumer's-eye check.
      - name: Unit tests
        run: bun test

      # The docs example modules are generated from each component's .md fences
      # (tools/docgen). Fail if the committed output is stale, then type-check every
      # generated fence against the real component prop types, so a breaking prop
      # change or a forgotten `bun run docs:gen` is caught here, not at native build.
      - name: Check generated docs examples are up to date
        run: bun run docs:gen:check

      - name: Typecheck generated docs examples
        run: bunx tsc --noEmit -p docs/src/core/tsconfig.json

      - name: Verify package exports
        run: bun -e "import { cn, getTheme, token } from './src/index.ts'; console.log('JS exports OK')"

      - name: Validate theme tokens
        run: bun run validate-tokens

      - name: Check CSS + JS size budgets
        run: bun run check-size

  # Docs build: the universal RN app (docs) is what the Pages deploy ships, so a
  # broken web export fails CI before it can be deployed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root deps (for the source symlink)
        run: bun install --frozen-lockfile

      - name: Regenerate docs core
        run: bun run docs:gen

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      # Fail here if the nav config drifts from the generated docs core, instead of
      # merging green and only breaking a later Pages deploy.
      - name: Check nav config is in sync
        working-directory: docs
        run: bun run check:nav

      - name: Typecheck docs
        working-directory: docs
        run: bunx tsc --noEmit

      - name: Export web build
        working-directory: docs
        run: npx expo export -p web
        env:
          EXPO_BASE_URL: /canvas
