name: Deploy - canvas

# One main-push pipeline prepares, validates and publishes a frozen candidate.
# All paths qualify so an advancing main always schedules a replacement candidate.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages:
        description: Deploy validated web docs to Cloudflare Pages
        type: boolean
        default: true
      npm:
        description: Publish a validated patch or minor release with pending changesets
        type: boolean
        default: false
      ios:
        description: EAS-build the iOS docs app
        type: boolean
        default: true
      android:
        description: EAS-build the Android docs app
        type: boolean
        default: true
      profile:
        description: EAS build profile (production auto-submits to the stores)
        type: choice
        options: [production, preview, development]
        default: production

# Finish accepted publication before another run can deploy newer artifacts.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Prepare immutable version candidate
        run: node scripts/release.mjs prepare "$RUNNER_TEMP/candidate"
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_NPM: ${{ github.event_name == 'push' || inputs.npm }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 7
          if-no-files-found: error

  validate:
    needs: prepare
    uses: ./.github/workflows/validate.yml
    with:
      candidate: true

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      accepted: ${{ steps.publish.outputs.accepted }}
      status: ${{ steps.publish.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/artifacts
      - name: Restore validated candidate
        run: node scripts/release.mjs restore "$RUNNER_TEMP/candidate"
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Accept candidate and publish tested tarball
        id: publish
        run: node scripts/release.mjs publish "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/artifacts"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm outcome
        if: always()
        env:
          OUTCOME: ${{ steps.publish.outcome }}
          STATUS: ${{ steps.publish.outputs.status }}
        run: |
          {
            echo '### npm release'
            echo "Publication step: ${OUTCOME:-not started}. Candidate result: ${STATUS:-not accepted}."
            case "$STATUS" in
              published) echo 'The validated tarball was published and its candidate tag was pushed.' ;;
              stale) echo 'Main advanced. No artifact was published and no tag was pushed; the newer main run owns release preparation.' ;;
              blocked-major) echo 'Major releases are blocked for automatic and manual runs. The generic npm checkbox does not authorize a major.' ;;
              no-changesets|not-requested) echo 'No npm publication was requested by this candidate.' ;;
              *) echo 'Publication did not complete. Inspect the failed stage. After a partial release, fix the cause and add a new changeset for the next version.' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  cloudflare:
    needs: [validate, publish]
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' && needs.publish.outputs.accepted == 'true' && (github.event_name == 'push' || inputs.pages) && vars.CLOUDFLARE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/artifacts
      - name: Verify and extract validated docs
        run: |
          node scripts/release.mjs restore "$RUNNER_TEMP/candidate"
          node scripts/release.mjs verify "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/artifacts"
          mkdir -p docs/dist
          tar -xzf "$RUNNER_TEMP/artifacts/docs.tgz" -C docs/dist
        env:
          SOURCE_SHA: ${{ github.sha }}
      # Keep preview access restricted in Cloudflare. Permanent deployment URLs
      # remain behind Access; only the production host serves the public site.
      - name: Publish the tested docs to Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT || 'canvas' }} --branch=main
      - name: Web outcome
        if: always()
        env:
          OUTCOME: ${{ steps.cf.outcome }}
          DEPLOYMENT_URL: ${{ steps.cf.outputs.deployment-url }}
        run: |
          {
            echo '### Web docs (Cloudflare Pages)'
            echo "Deployment step: ${OUTCOME:-not started}."
            if [ "$OUTCOME" = success ]; then
              echo '- [canvas.nannier.com](https://canvas.nannier.com/)'
              echo "- [Exact deployment]($DEPLOYMENT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: [validate, publish]
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' && needs.publish.outputs.accepted == 'true' && github.event_name == 'workflow_dispatch' && inputs.ios && vars.EAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PLATFORM: ios
      EAS_PROFILE: ${{ inputs.profile }}
      # iOS submission works: the App Store Connect API key is stored on EAS.
      EAS_SUBMIT: ${{ inputs.profile == 'production' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate

      - name: Restore validated source
        run: node scripts/release.mjs restore "$RUNNER_TEMP/candidate"
        env:
          SOURCE_SHA: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Native consumes the same validated source and generated docs core.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      # --auto-submit only for production: docs/eas.json defines only
      # submit.production (TestFlight / Play internal draft); preview + development
      # are internal distribution and must not be submitted. --auto-submit composes
      # with --no-wait: EAS creates the submission server-side when the build
      # completes.
      - name: EAS build (queued remotely; runner exits immediately)
        working-directory: docs
        run: |
          args=(--platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait --json)
          # --auto-submit is opt-in per platform (EAS_SUBMIT) rather than keyed off the
          # profile alone, because a platform can be buildable while its store account
          # is not yet set up. Submitting without those credentials fails the build
          # command outright, taking a successful build down with it.
          if [ "$EAS_SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          builds=$(eas build "${args[@]}")
          echo "$builds"
          asc_id=$(node -p "require('./eas.json').submit.production.ios.ascAppId" 2>/dev/null || echo "")
          {
            echo "### iOS build queued"
            echo ""
            echo "$builds" | jq -r '.[] | "- **Build \(.appBuildVersion // "?") (v\(.appVersion // "?"))**: [watch it build on EAS](\(.buildDetailsPageUrl // ("https://expo.dev/builds/" + .id)))"' \
              || echo "- [Track progress on EAS](https://expo.dev)"
            echo ""
            if [ "$EAS_SUBMIT" = "true" ]; then
              echo "Auto-submit is ON. When the build finishes, EAS uploads it to App Store Connect (a few more minutes for Apple to process it):"
              echo ""
              [ -n "$asc_id" ] && echo "- [TestFlight builds](https://appstoreconnect.apple.com/apps/$asc_id/testflight/ios)"
              [ -n "$asc_id" ] && echo "- [App Store listing (attach the build, then submit for review)](https://appstoreconnect.apple.com/apps/$asc_id/distribution/ios/version/inflight)"
            else
              echo "Auto-submit is OFF (profile \`$EAS_PROFILE\`), so the build stays on EAS for manual download."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: [validate, publish]
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' && needs.publish.outputs.accepted == 'true' && github.event_name == 'workflow_dispatch' && inputs.android && vars.EAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PLATFORM: android
      EAS_PROFILE: ${{ inputs.profile }}
      # Android submission additionally needs a Google service account key on EAS, which
      # cannot exist until the Play Developer account does. Until then this stays false so
      # the build still runs and produces an .aab to upload by hand; set the repo variable
      # PLAY_SUBMIT_ENABLED to 'true' once the service account is attached.
      EAS_SUBMIT: ${{ inputs.profile == 'production' && vars.PLAY_SUBMIT_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate

      - name: Restore validated source
        run: node scripts/release.mjs restore "$RUNNER_TEMP/candidate"
        env:
          SOURCE_SHA: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Native consumes the same validated source and generated docs core.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: EAS build (queued remotely; runner exits immediately)
        working-directory: docs
        run: |
          args=(--platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait --json)
          if [ "$EAS_SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          builds=$(eas build "${args[@]}")
          echo "$builds"
          {
            echo "### Android build queued"
            echo ""
            echo "$builds" | jq -r '.[] | "- **Build \(.appBuildVersion // "?") (v\(.appVersion // "?"))**: [watch it build on EAS](\(.buildDetailsPageUrl // ("https://expo.dev/builds/" + .id)))"' \
              || echo "- [Track progress on EAS](https://expo.dev)"
            echo ""
            if [ "$EAS_SUBMIT" = "true" ]; then
              echo "Auto-submit is ON. When the build finishes, EAS uploads it to the Play internal track as a draft:"
              echo ""
              echo "- [Play Console](https://play.google.com/console)"
            else
              echo "Auto-submit is OFF. Download the \`.aab\` from the EAS link above and upload it by hand."
              echo "Play cannot create a first release through the API, so the first upload is manual regardless."
              echo "Set the repo variable \`PLAY_SUBMIT_ENABLED\` to \`true\` once a Google service account key is attached to EAS."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    needs: [prepare, validate, publish, cloudflare, ios, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report every stage
        env:
          PREPARE: ${{ needs.prepare.result }}
          VALIDATE: ${{ needs.validate.result }}
          PUBLISH: ${{ needs.publish.result }}
          STATUS: ${{ needs.publish.outputs.status }}
          WEB: ${{ needs.cloudflare.result }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          {
            echo '### Candidate delivery results'
            echo "- Preparation: $PREPARE"
            echo "- Validation (including browser tests): $VALIDATE"
            echo "- npm transaction: $PUBLISH (${STATUS:-not started})"
            echo "- Web deployment: $WEB"
            echo "- iOS build submission: $IOS"
            echo "- Android build submission: $ANDROID"
            echo 'Native success means queued on EAS; build and store results are reported by EAS.'
            if [ "$PUBLISH" = failure ]; then
              echo 'After a partial release, fix the cause and add a new changeset for the next version.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
