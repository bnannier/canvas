name: Deploy — canvas

# The deploy surface for this repo, split by how expensive and how reversible each
# target is:
#
#   AUTOMATIC on every push to main
#     - the web docs, published to Cloudflare Pages at canvas.nannier.com
#     - npm, which is a no-op unless a changeset bumped the version
#
#   MANUAL, via the "Run workflow" button
#     - the EAS native builds, which cost build minutes and, on the production profile,
#       push binaries at Apple and Google
#
# Each target is its own job, so they show as separate boxes and one cannot fail another.
# Every job writes clickable links for its result into the run summary.
#
# The `profile` input picks the EAS build profile: `production` auto-submits to
# TestFlight / Google Play internal (the only profile with a submit config in
# docs/eas.json); `preview` / `development` produce internal-distribution builds
# (Android APK + ad-hoc iOS) shared by URL, with no store submission.
#
# EAS ONE-TIME SETUP (until done, the native job shows as "skipped"):
#   1. EXPO_TOKEN repo secret (expo.dev -> account settings -> Access Tokens).
#   2. iOS: distribution cert + provisioning profile + an App Store Connect API key
#      on EAS (`eas credentials -p ios`) so submission runs unattended.
#   3. Android: app created in the Play Console for com.nannier.canvas, a
#      Google service-account key on EAS (`eas credentials -p android`), and the
#      VERY FIRST .aab uploaded manually once (Google's API cannot create the first
#      release).
#   4. Set the repo VARIABLE `EAS_ENABLED` to `true` (Settings -> Secrets and
#      variables -> Actions -> Variables). It gates the native job at the job level
#      because `secrets` cannot be read in a job-level `if`.
on:
  # The web docs and the npm package publish THEMSELVES on every push to main: both are
  # cheap, reversible-ish, and gated by their own tooling (Pages just replaces the site;
  # `changeset publish` is a no-op unless the local version is absent from the registry,
  # which only happens after a `changeset version` bump). The native store builds stay
  # MANUAL below, because they cost EAS build minutes and, on the production profile,
  # push binaries at Apple and Google.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'docs/**'
      - 'tools/**'
      - 'package.json'
      - 'bun.lock'
      - '.changeset/**'
  workflow_dispatch:
    inputs:
      pages:
        description: "Deploy web docs to Cloudflare Pages (canvas.nannier.com)"
        type: boolean
        default: true
      npm:
        # Defaults to FALSE unlike the others: this publishes a real, public, immutable
        # release, so it must be opted into deliberately rather than left ticked.
        description: "Publish @nannier/canvas to npm"
        type: boolean
        default: false
      ios:
        description: "EAS-build the iOS docs app"
        type: boolean
        default: true
      android:
        description: "EAS-build the Android docs app"
        type: boolean
        default: true
      profile:
        description: "EAS build profile (production auto-submits to the stores)"
        type: choice
        options: [production, preview, development]
        default: production

# Deploys are serialized and never cancelled: two npm publishes racing could
# double-commit version bumps, and an in-flight Pages deploy should always finish.
concurrency:
  group: deploy
  cancel-in-progress: false

# No workflow-level grant: each job scopes exactly the permissions it uses.

jobs:
  # --------------------------------------------------------- Cloudflare Pages (web)
  # Publishes the web docs to canvas.nannier.com. This replaced a GitHub Pages deploy,
  # for two reasons worth remembering before anyone moves it back:
  #   - the site is served from the ROOT of its own subdomain rather than a /canvas
  #     subpath, which was a repeated source of asset-path bugs, so there is no
  #     EXPO_BASE_URL here;
  #   - docs/public/_redirects performs a real SPA rewrite, so deep routes answer 200.
  #     Pages has no rewrites, so serving an SPA there means copying index.html to
  #     404.html and every deep route answering with a 404 STATUS while rendering fine.
  #     Both app stores fetch the privacy policy URL they are given, which is what turned
  #     that from cosmetic into a submission risk.
  #
  # Gated on CLOUDFLARE_ENABLED so the job self-disables if the credentials are ever
  # removed, rather than failing every push.
  cloudflare:
    if: ${{ (github.event_name == 'push' || inputs.pages) && vars.CLOUDFLARE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Root deps first: docs consumes the source-only kit as a live symlink
      # (docs postinstall), so the root tree must exist before the docs install.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Check generated docs core is up to date
        run: bun run docs:gen:check

      - name: Check menu-glyph rasters are up to date
        run: bun run raster:gen:check

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Typecheck docs
        working-directory: docs
        run: bunx tsc --noEmit

      - name: Check nav config is in sync
        working-directory: docs
        run: bun run check:nav

      # No EXPO_BASE_URL: served from the root of canvas.nannier.com.
      # build:web is `expo export -p web` plus scripts/preload-fonts.mjs, which adds
      # <link rel="preload"> for the eight Geist faces. The root layout holds the tree
      # back until they load, and they could not start downloading until the bundle had
      # been fetched and executed, so they sat at the tail of the critical chain. Measured
      # over three runs per arm, preloading them cut First Contentful Paint from ~972ms to
      # ~211ms and Speed Index from ~2156 to ~380, with CLS unchanged at 0.006. The step
      # is defined in package.json so a local export matches what CI ships.
      - name: Export web build
        working-directory: docs
        run: bun run build:web

      # wrangler's Pages upload SKIPS every path containing a `node_modules` segment, and
      # Expo emits bundled package assets to dist/assets/node_modules/<pkg>/... mirroring
      # their source path. The Geist font files land exactly there, so they were silently
      # dropped from the upload: 421 files built, 366 uploaded. The app then waits forever
      # on useFonts and renders nothing, and because _redirects answers every unknown path
      # with index.html at status 200, the missing fonts surfaced as neither a 404 nor a
      # console error. A blank page with no diagnostics at all.
      #
      # Renaming that one path segment (and every reference to it) is enough to make the
      # assets uploadable. The checks below fail the build rather than let a fontless,
      # blank site deploy again.
      - name: Un-hide bundled package assets from wrangler
        working-directory: docs
        run: |
          if [ -d dist/assets/node_modules ]; then
            mv dist/assets/node_modules dist/assets/vendor
            find dist -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' -o -name '*.json' \) \
              -exec sed -i 's|assets/node_modules|assets/vendor|g' {} +
            echo "moved dist/assets/node_modules -> dist/assets/vendor and rewrote references"
          else
            echo "no dist/assets/node_modules present; nothing to move"
          fi
          if find dist -type d -name node_modules | grep -q .; then
            echo "::error::a node_modules path remains under dist; wrangler would skip it"; exit 1
          fi
          if grep -rq "assets/node_modules" dist 2>/dev/null; then
            echo "::error::stale assets/node_modules references remain; fonts would 404"; exit 1
          fi

      # Fails loudly rather than shipping a site whose deep routes 404: _redirects is what
      # makes this host better than Pages, and it only works if it reached the artifact.
      - name: Verify SPA rewrite and privacy page are in the artifact
        working-directory: docs
        run: |
          test -f dist/_redirects || { echo "::error::dist/_redirects missing; SPA routes would 404"; exit 1; }
          test -f dist/privacy/index.html || { echo "::error::dist/privacy/index.html missing; the store privacy URL would break"; exit 1; }
          test -f dist/_headers || { echo "::error::dist/_headers missing; the site would deploy with no CSP, HSTS or asset caching"; exit 1; }

      # A preload pointing at a path that does not exist is worse than no preload: the
      # browser spends a high-priority connection on a 404 and then fetches the real font
      # anyway. These hrefs are written before the vendor rename above rewrites them, so
      # this also proves that rewrite reached index.html.
      - name: Verify font preloads resolve
        working-directory: docs
        run: |
          n=$(grep -c 'rel="preload" as="font"' dist/index.html || true)
          test "$n" = "8" || { echo "::error::expected 8 font preloads in dist/index.html, found $n"; exit 1; }
          grep -o 'rel="preload" as="font"[^>]*href="[^"]*"' dist/index.html \
            | sed 's/.*href="//;s/"//' | while read -r h; do
              test -f "dist${h}" || { echo "::error::preloaded font not in artifact: ${h}"; exit 1; }
            done
          echo "all 8 preloaded fonts resolve to files in the artifact"
          echo "_redirects and privacy/index.html present"

      # Every Pages deployment keeps a permanent, individually addressable URL of the form
      # <hash>.canvas-wna.pages.dev, and those are PUBLIC by default. That is not merely
      # untidy: a deployment goes on serving whatever it contained forever, so anything
      # published by mistake stays published even after the next deploy removes it. It bit
      # us exactly once — four deployments kept serving JavaScript source maps carrying
      # 363 of the kit's own source files after the maps had been removed from the build.
      #
      # The project's Settings now has "Preview access" restricted by a Cloudflare Access
      # policy, so every <hash> URL answers 302 to a login. canvas.nannier.com and the
      # apex canvas-wna.pages.dev stay public, which is the intent: serve the latest, not
      # every release. If you ever need a specific old deployment, sign in through Access
      # rather than turning the policy off.
      - name: Publish to Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT || 'canvas' }} --branch=main

      - name: Summarise the deploy
        if: always()
        run: |
          {
            echo "### Web docs (Cloudflare Pages)"
            echo ""
            echo "- [canvas.nannier.com](https://canvas.nannier.com/)"
            echo "- [Privacy policy](https://canvas.nannier.com/privacy/) (the URL filed with both app stores)"
            [ -n "${{ steps.cf.outputs.deployment-url }}" ] && echo "- [This exact deployment](${{ steps.cf.outputs.deployment-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------ npm
  # Changesets release. If there are pending changesets, consume them (version bump
  # + CHANGELOG) and commit directly to main; then ALWAYS run `changeset publish`.
  # Publish is idempotent: it only publishes versions missing from npm, so a publish
  # that failed once converges on the next run without a fresh changeset. Avoids the
  # PR-creation path entirely (no "Actions can create PRs" repo setting needed).
  npm:
    # Automatic on a push to main; on a manual run it obeys the checkbox. `changeset
    # publish` is a no-op when the local version already exists on the registry, so a
    # push with no version bump publishes nothing. The version-bump commit carries
    # [skip ci], which is what stops it from retriggering this workflow forever.
    if: ${{ github.event_name == 'push' || inputs.npm }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # A MAJOR bump is never allowed to happen automatically. An automatic push should
      # only ever move the minor or patch digit; a breaking release is a deliberate act
      # that deserves a human pressing the button, not a side effect of merging. This is
      # not hypothetical: a major changeset once rode a push straight to a published
      # 2.0.0. When a major is pending, the automatic path stops here and the run reports
      # what to do; a manual run (workflow_dispatch) still performs it.
      - name: Block automatic major releases
        id: major_guard
        run: |
          major=$(grep -lE "^['\"]?@nannier/canvas['\"]?:[[:space:]]*major" .changeset/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "major=$major" >> "$GITHUB_OUTPUT"
          if [ "$major" != "0" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "### npm release held back"
              echo ""
              echo "$major pending changeset(s) request a **major** version bump, and automatic"
              echo "publishing is limited to minor and patch releases."
              echo ""
              echo "Run the Deploy workflow manually with the npm box ticked to publish it,"
              echo "or downgrade the changeset to \`minor\` if a breaking release was not intended."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Major bump pending; skipping the automatic release."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for pending changesets
        if: steps.major_guard.outputs.blocked != 'true'
        id: has_changesets
        run: |
          # count .md files in .changeset/ that aren't README.md
          count=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count pending changeset(s)."

      - name: Configure git
        if: steps.major_guard.outputs.blocked != 'true' && steps.has_changesets.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The [skip ci] matters: ci.yml's paths filter includes package.json and
      # .changeset/**, so without it the version commit would burn a CI run.
      - name: Version packages
        if: steps.major_guard.outputs.blocked != 'true' && steps.has_changesets.outputs.count != '0'
        run: |
          bun run version-packages
          git add .
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: version packages [skip ci]"
            # Rebase onto latest main, then push. Retried because concurrent
            # worktree pushes can land on main between the rebase and the push,
            # rejecting it as non-fast-forward.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::could not push the version commit after 3 attempts (main kept advancing). Re-run the deploy."
                exit 1
              fi
              echo "Push rejected (main advanced); retrying ($attempt/3)..."
            done
          fi

      - name: Authenticate npm (npmjs.org)
        if: steps.major_guard.outputs.blocked != 'true'
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "@nannier:registry=https://registry.npmjs.org" >> .npmrc

      # Runs UNCONDITIONALLY (not gated on pending changesets): publish is
      # idempotent, so this also retries any version already on main but missing
      # from npm.
      - name: Publish to npmjs.org
        if: steps.major_guard.outputs.blocked != 'true'
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        if: steps.major_guard.outputs.blocked != 'true'
        run: git push --tags

      # Clickable result in the run summary. Reads the version AFTER `changeset version`
      # ran, so it names what actually went out, and reports plainly when a run published
      # nothing (the common case: a push with no pending changesets).
      - name: Summarise the release
        if: always()
        run: |
          version=$(node -p "require('./package.json').version")
          {
            echo "### npm"
            if [ "${{ steps.has_changesets.outputs.count }}" = "0" ]; then
              echo "No pending changesets, so nothing was published. Current version is \`$version\`."
            else
              echo "Published **@nannier/canvas@$version**"
              echo ""
              echo "- [View on npm](https://www.npmjs.com/package/@nannier/canvas/v/$version)"
              echo "- [Release tag](https://github.com/${{ github.repository }}/releases/tag/v$version)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------- EAS native (iOS/Android)
  # Green here means "queued on EAS"; build + store-submission results live on expo.dev
  # (links land in the run summary).
  # iOS and Android are SEPARATE jobs, not one "native" job driven by --platform all, so
  # each renders as its own box and, more importantly, so one platform cannot fail the
  # other. They were combined until a run proved the hazard: both builds queued fine, then
  # the Android submission aborted the whole job ("Google Service Account Keys cannot be
  # set up in --non-interactive mode"), marking a perfectly good iOS build red. The setup
  # steps are duplicated between the two rather than hidden in a composite action; the
  # repetition is a handful of lines and keeps each job readable on its own.
  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios && vars.EAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PLATFORM: ios
      EAS_PROFILE: ${{ inputs.profile }}
      # iOS submission works: the App Store Connect API key is stored on EAS.
      EAS_SUBMIT: ${{ inputs.profile == 'production' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The native app consumes the source-only kit + the generated docs core through
      # symlinks (docs postinstall), so root deps + docgen must precede the EAS build.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Regenerate docs core
        run: bun run docs:gen

      # The native app bundles the menu-glyph PNGs, so bake them fresh against the current
      # kit glyphs (same rationale as regenerating docs core above).
      - name: Regenerate menu-glyph rasters
        run: bun run raster:gen

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      # --auto-submit only for production: docs/eas.json defines only
      # submit.production (TestFlight / Play internal draft); preview + development
      # are internal distribution and must not be submitted. --auto-submit composes
      # with --no-wait: EAS creates the submission server-side when the build
      # completes.
      - name: EAS build (queued remotely; runner exits immediately)
        working-directory: docs
        run: |
          args=(--platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait --json)
          # --auto-submit is opt-in per platform (EAS_SUBMIT) rather than keyed off the
          # profile alone, because a platform can be buildable while its store account
          # is not yet set up. Submitting without those credentials fails the build
          # command outright, taking a successful build down with it.
          if [ "$EAS_SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          builds=$(eas build "${args[@]}")
          echo "$builds"
          asc_id=$(node -p "require('./eas.json').submit.production.ios.ascAppId" 2>/dev/null || echo "")
          {
            echo "### iOS build queued"
            echo ""
            echo "$builds" | jq -r '.[] | "- **Build \(.appBuildVersion // "?") (v\(.appVersion // "?"))**: [watch it build on EAS](\(.buildDetailsPageUrl // ("https://expo.dev/builds/" + .id)))"' \
              || echo "- [Track progress on EAS](https://expo.dev)"
            echo ""
            if [ "$EAS_SUBMIT" = "true" ]; then
              echo "Auto-submit is ON. When the build finishes, EAS uploads it to App Store Connect (a few more minutes for Apple to process it):"
              echo ""
              [ -n "$asc_id" ] && echo "- [TestFlight builds](https://appstoreconnect.apple.com/apps/$asc_id/testflight/ios)"
              [ -n "$asc_id" ] && echo "- [App Store listing (attach the build, then submit for review)](https://appstoreconnect.apple.com/apps/$asc_id/distribution/ios/version/inflight)"
            else
              echo "Auto-submit is OFF (profile \`$EAS_PROFILE\`), so the build stays on EAS for manual download."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android && vars.EAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PLATFORM: android
      EAS_PROFILE: ${{ inputs.profile }}
      # Android submission additionally needs a Google service account key on EAS, which
      # cannot exist until the Play Developer account does. Until then this stays false so
      # the build still runs and produces an .aab to upload by hand; set the repo variable
      # PLAY_SUBMIT_ENABLED to 'true' once the service account is attached.
      EAS_SUBMIT: ${{ inputs.profile == 'production' && vars.PLAY_SUBMIT_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The native app consumes the source-only kit + the generated docs core through
      # symlinks (docs postinstall), so root deps + docgen must precede the EAS build.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Regenerate docs core
        run: bun run docs:gen

      # The native app bundles the menu-glyph PNGs, so bake them fresh against the current
      # kit glyphs (same rationale as regenerating docs core above).
      - name: Regenerate menu-glyph rasters
        run: bun run raster:gen

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: EAS build (queued remotely; runner exits immediately)
        working-directory: docs
        run: |
          args=(--platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait --json)
          if [ "$EAS_SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          builds=$(eas build "${args[@]}")
          echo "$builds"
          {
            echo "### Android build queued"
            echo ""
            echo "$builds" | jq -r '.[] | "- **Build \(.appBuildVersion // "?") (v\(.appVersion // "?"))**: [watch it build on EAS](\(.buildDetailsPageUrl // ("https://expo.dev/builds/" + .id)))"' \
              || echo "- [Track progress on EAS](https://expo.dev)"
            echo ""
            if [ "$EAS_SUBMIT" = "true" ]; then
              echo "Auto-submit is ON. When the build finishes, EAS uploads it to the Play internal track as a draft:"
              echo ""
              echo "- [Play Console](https://play.google.com/console)"
            else
              echo "Auto-submit is OFF. Download the \`.aab\` from the EAS link above and upload it by hand."
              echo "Play cannot create a first release through the API, so the first upload is manual regardless."
              echo "Set the repo variable \`PLAY_SUBMIT_ENABLED\` to \`true\` once a Google service account key is attached to EAS."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
