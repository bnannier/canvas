name: Release — canvas

# Changesets-powered release. Runs ONLY after the CI workflow completes
# successfully on main — avoids racing CI in parallel and never publishes a
# version that hasn't passed checks. On a successful CI run:
#   1. If there are pending changesets, consume them locally (version bump +
#      CHANGELOG update) and commit directly to main.
#   2. ALWAYS run `changeset publish` afterward. It is idempotent: it only
#      publishes versions missing from npm. So a publish that failed once
#      (a transient registry or auth error) is retried on the next CI run
#      WITHOUT needing a fresh changeset, and a version already bumped on main
#      always converges to npm instead of drifting.
#
# Avoids the PR-creation path entirely so it does not need the
# "Allow GitHub Actions to create and approve pull requests" repo setting.

on:
  workflow_run:
    workflows: ["CI — canvas"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_run fires on every completion (success/failure/cancelled). Gate
    # to success-only here so a red CI doesn't trigger a publish attempt.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # workflow_run runs against the default branch by default; pin to the
          # SHA that triggered CI so we publish the exact code that was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check for pending changesets
        id: has_changesets
        run: |
          # count .md files in .changeset/ that aren't README.md
          count=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count pending changeset(s)."

      - name: Configure git
        if: steps.has_changesets.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version packages
        if: steps.has_changesets.outputs.count != '0'
        run: |
          bun run version-packages
          git add .
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: version packages [skip ci]"
            # Rebase the bump commit onto latest main before pushing. With the
            # workflow_run trigger we check out `head_sha` (the SHA CI ran on),
            # which can be stale by the time Release runs — main may have
            # advanced via subsequent pushes. Without this, the push is
            # rejected as non-fast-forward.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      # Auth + publish run UNCONDITIONALLY (not gated on pending changesets):
      # `changeset publish` is idempotent, so this both publishes a fresh bump
      # and retries any version that is on main but missing from npm.
      - name: Authenticate npm (npmjs.org)
        run: |
          # Auth against the public npmjs.org registry. Package name is
          # `@olympusoss/canvas` so the scope must be a real org on npmjs.org
          # with publish access for the token's owner.
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "@olympusoss:registry=https://registry.npmjs.org" >> .npmrc

      - name: Publish to npmjs.org
        run: bun run release
        env:
          # `bun run release` → `changeset publish` → reads NODE_AUTH_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        run: git push --tags

