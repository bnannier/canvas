name: docs-native — EAS build

# Internal-distribution native binary builds (Android APK + ad-hoc iOS) of the
# universal docs app. This is MANUAL ONLY (workflow_dispatch): native binaries are
# heavy and need Apple/Google signing credentials configured on EAS, so they should
# not run on every push. The lightweight per-push Expo Go preview is published by
# eas-update.yml instead; the web build/deploy is handled by docs.yml.
#
# Requires the EXPO_TOKEN secret and the app linked to an Expo project (`eas init`,
# see docs-next/README). Since this is a deploy, the preflight FAILS LOUDLY (red)
# with an actionable message when either is missing, rather than passing silently.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        default: "preview"
        type: choice
        options: [preview, production, development]

concurrency:
  group: docs-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # Checkout first so the preflight can read docs-next/app.json for the project link.
      - uses: actions/checkout@v6

      # Fail LOUDLY (red) with an actionable message rather than skipping, so a
      # misconfigured build is never mistaken for a successful one.
      - name: Preflight (require EXPO_TOKEN + project link)
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under repo Settings → Secrets and variables → Actions so CI can authenticate to Expo."
            exit 1
          fi
          if ! grep -q '"projectId"' docs-next/app.json; then
            echo "::error::No Expo project linked: docs-next/app.json has no extra.eas.projectId. Run 'eas init' in docs-next/ and commit the result."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The native app consumes the source-only library + generated docs-core via
      # symlinks (docs-next postinstall). Install root deps first so those exist.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Regenerate docs-core
        run: bun run docs:gen

      - name: Install docs-next deps
        working-directory: docs-next
        run: bun install

      - name: Typecheck native app
        working-directory: docs-next
        run: bunx tsc --noEmit

      - name: EAS build (internal distribution)
        working-directory: docs-next
        run: eas build --platform all --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
