name: Deploy docs to GitHub Pages

# Builds the universal React Native docs app (docs-next) for the web and publishes it to
# GitHub Pages at https://olympusoss.github.io/canvas/. The docs are now one Expo Router
# app that renders on iOS, Android, and the web from the same code; this deploys the web
# target. Runs on pushes to main that touch the app, the generated docs data, the library
# source, or the codegen, plus manual rebuilds. (The old Vite docs/ is retained for
# rollback; revert this file to redeploy it.)
on:
  push:
    branches: [main]
    paths:
      - 'docs-next/**'
      - 'docs-core/**'
      - 'tools/**'
      - 'src/**'
      - 'styles/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install root deps first: docs-next consumes the source-only library + the generated
      # docs-core as live symlinks (created by the docs-next postinstall), so those targets
      # must exist before the docs-next install.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Regenerate docs-core (fail if drift)
        run: |
          bun run docs:gen
          if [ -n "$(git status --porcelain docs-core)" ]; then
            echo "::error::docs-core is out of date. Run 'bun run docs:gen' and commit the result."
            git --no-pager diff --stat docs-core
            exit 1
          fi

      - name: Install docs-next deps
        working-directory: docs-next
        run: bun install --frozen-lockfile

      - name: Typecheck docs-next
        working-directory: docs-next
        run: bunx tsc --noEmit

      # The single nav source of truth (nav.config.json) must stay 1:1 with docs-core,
      # so a component/template/pattern can never drift out of the navigation.
      - name: Check nav config in sync with docs-core
        working-directory: docs-next
        run: bun run check:nav

      - name: Export web build
        working-directory: docs-next
        run: npx expo export -p web
        env:
          # Served under /canvas/ on Pages; app.config.js reads this into experiments.baseUrl.
          EXPO_BASE_URL: /canvas

      - name: SPA fallback + .nojekyll
        working-directory: docs-next
        run: |
          # GitHub Pages serves 404.html for unknown paths; a copy of index.html lets the
          # SPA boot and client-route any deep link (e.g. /canvas/components/button). The
          # Expo export emits an _expo/ dir, which Jekyll would ignore without .nojekyll.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-next/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
