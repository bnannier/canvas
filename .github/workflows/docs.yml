name: Deploy docs to GitHub Pages

# Builds the docs Vite bundle and publishes it to GitHub Pages at
# https://olympusoss.github.io/canvas/. Runs on every push to main that touches
# the docs, the component source, or the styles (so the live docs always reflect
# what shipped), plus manual rebuilds via workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'styles/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Canvas deps (for type resolution)
        run: bun install --frozen-lockfile

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Typecheck docs
        working-directory: docs
        run: bunx tsc --noEmit

      - name: Build docs
        working-directory: docs
        run: bun run build
        env:
          # Served under /canvas/ on Pages; vite.config + the router read this.
          VITE_BASE_PATH: /canvas/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
