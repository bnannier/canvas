name: Deploy docs to GitHub Pages

# Builds the universal React Native docs app (docs/) for the web and publishes it to
# GitHub Pages at https://olympusoss.github.io/canvas/. The docs are one Expo Router app
# that renders on iOS, Android, and the web from the same code; this deploys the web
# target. Runs on pushes to main that touch the app, the generated docs data, the library
# source, or the codegen, plus manual rebuilds.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'src/**'
      - 'styles/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install root deps first: docs consumes the source-only @olympusoss/canvas
      # library as a live symlink (created by the docs postinstall), so it must exist
      # before the docs install.
      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Regenerate docs core (fail if drift)
        run: |
          bun run docs:gen
          if [ -n "$(git status --porcelain docs/src/core)" ]; then
            echo "::error::the generated docs core is out of date. Run 'bun run docs:gen' and commit the result."
            git --no-pager diff --stat docs/src/core
            exit 1
          fi

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Typecheck docs
        working-directory: docs
        run: bunx tsc --noEmit

      # The single nav source of truth (nav.config.json) must stay 1:1 with the docs core data,
      # so a component/template/pattern can never drift out of the navigation.
      - name: Check nav config in sync with the docs core data
        working-directory: docs
        run: bun run check:nav

      - name: Export web build
        working-directory: docs
        run: npx expo export -p web
        env:
          # Served under /canvas/ on Pages; app.config.js reads this into experiments.baseUrl.
          EXPO_BASE_URL: /canvas

      - name: SPA fallback + .nojekyll
        working-directory: docs
        run: |
          # GitHub Pages serves 404.html for unknown paths; a copy of index.html lets the
          # SPA boot and client-route any deep link (e.g. /canvas/components/button). The
          # Expo export emits an _expo/ dir, which Jekyll would ignore without .nojekyll.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        # enablement: true auto-enables GitHub Pages (Source: GitHub Actions) if
        # it is off, instead of failing the build with "Get Pages site failed".
        # The job already has `pages: write`, so it can flip the setting itself.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
