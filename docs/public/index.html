<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <!--
      Project-owned shell template for the web export (and dev server). With
      web.output "single" there is no static rendering, so social scrapers only ever
      see this file: it carries the Open Graph / Twitter / canonical metadata for
      every route (deep links serve it too, via the 404.html SPA fallback on Pages).

      Expo CLI resolves public/index.html ahead of its built-in template, then
      substitutes the LANG_ISO_CODE and WEB_TITLE percent-placeholders, injects the
      favicon link plus stylesheets before the closing head tag and the bundle
      scripts before the closing body tag. Each of those four substitutions targets
      the FIRST occurrence of its marker in the file, so the placeholders and the
      two closing tags must appear nowhere before their real positions; that is why
      this comment names the markers only in prose.

      og.png is generated from .github/assets/hero.png by `bun run og:gen`.
    -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <meta
      name="description"
      content="Canvas is an universal React Native UI kit that renders native iOS, Material 3 Android, and web looks from a single component API. Semantic boolean props, accessible by default, with real Liquid Glass on iOS 26."
    />
    <link rel="canonical" href="https://bnannier.github.io/canvas/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canvas" />
    <meta property="og:title" content="Canvas: One component API. Three native looks." />
    <meta
      property="og:description"
      content="Canvas is an universal React Native UI kit that renders native iOS, Material 3 Android, and web looks from a single component API. Semantic boolean props, accessible by default, with real Liquid Glass on iOS 26."
    />
    <meta property="og:url" content="https://bnannier.github.io/canvas/" />
    <meta property="og:image" content="https://bnannier.github.io/canvas/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The same Canvas Select component rendered as native iOS, Material 3 Android, and web, side by side"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canvas: One component API. Three native looks." />
    <meta
      name="twitter:description"
      content="Canvas is an universal React Native UI kit that renders native iOS, Material 3 Android, and web looks from a single component API. Semantic boolean props, accessible by default, with real Liquid Glass on iOS 26."
    />
    <meta name="twitter:image" content="https://bnannier.github.io/canvas/og.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
